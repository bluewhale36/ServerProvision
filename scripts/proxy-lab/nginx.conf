# proxy-lab — docs/staging-vm-bootstrap.md §12 의 serverprovision.conf 를 TLS 세 줄(listen 443 ssl · ssl_certificate ·
# ssl_certificate_key)만 빼고 옮긴 거울이다. 런북의 nginx 설정을 고치면 이 파일도 함께 고친다(S7-1).
#
#   80 (호스트 7819) : 런북 그대로 — 응답 버퍼링 지시어 없음 = nginx 기본 proxy_buffering on
#   81 (호스트 7820) : 대조군 — proxy_buffering off 한 줄만 추가(정정 대안 B, 채택하지 않음)
#
# 앱 주소는 run.sh 가 __APP__ 을 치환한다(docker 안에서 호스트를 가리키는 host.docker.internal).
server {
    listen 80;
    client_max_body_size 20g;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    location / {
        proxy_pass http://__APP__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
server {
    listen 81;
    client_max_body_size 20g;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_buffering off;
    location / {
        proxy_pass http://__APP__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
