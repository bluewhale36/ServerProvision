# ---- E3.5-5-a — 진단 시점 RAID 채집 · 카드 불일치 예고 (execution.raid-card-check.* · execution.raid-inventory.*) ----
# 예고는 집행 대조(RaidCardMatch.judge)와 같은 판정을 개시 전에 보인다 — 상태 변경 없음. {0}=카드명 {1}=지정 Subsystem {2}=관측 Subsystem
execution.raid-card-check.match=지정 카드와 감지 카드가 일치합니다 ({2}).
execution.raid-card-check.mismatch=지정 {0} ({1}) 과 감지 카드 ({2}) 가 다릅니다 — 집행 시 CARD_MISMATCH 로 실패합니다. 정의서의 카드를 바꾸거나 카드 자원의 Subsystem 을 정정하십시오.
execution.raid-card-check.not-detected=지정 카드 {0} ({1}) 를 감지하지 못했습니다 — 집행 시 CARD_NOT_DETECTED 로 실패합니다.
execution.raid-card-check.unverifiable=카드 자원 {0} 에 Subsystem 이 확정되지 않아 대조할 수 없습니다 — 카드 자원 화면에서 관측값으로 확정하면 대조합니다.
execution.raid-inventory.empty=RAID 인벤토리가 아직 없습니다 — 진단 수집에서 RAID 카드가 감지되면 채워집니다. 카드가 없는 서버는 비어 있는 것이 정상입니다.

# ---- E3.5-5-b — RAID 카드 관측 채움 (management.raid-card.observation.* · action.confirm-observed) ----
# 관측은 저장하지 않고 "이 카드를 지정한 활성 할당의 게스트" 의 인벤토리에서 파생한다. 확정 불허 사유(tooltip · 409)는
# RaidCardObservationStatus.blockReason 이 보유한다(같은 상황엔 같은 문장). {0}=관측값 {1}=서버 수 또는 확정값
management.raid-card.observation.none=이 카드를 지정한 서버의 진단 결과가 아직 없습니다.
management.raid-card.observation.agreed=서버 {1}대가 관측했습니다. 확정하면 대조에 쓰입니다.
management.raid-card.observation.matches=관측이 확정값과 일치합니다 ({0} · 서버 {1}대)
management.raid-card.observation.differs=관측 {0} 이 확정값 {1} 과 다릅니다 — 정의서의 카드 지정이 틀렸거나 확정값이 틀렸습니다. 수정에서 정정하십시오.
management.raid-card.observation.conflicting=관측이 서로 다릅니다 ({0}) — 정의서의 카드 지정을 확인하십시오.
management.raid-card.observation.unconfirmed-hint=아직 확인되지 않았습니다. 수정에서 직접 입력하거나, 이 카드를 지정한 서버가 진단되면 관측값으로 확정합니다.
action.confirm-observed=관측값으로 확정
