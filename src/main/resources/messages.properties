# 검증 실패 문구의 사전. Bean Validation 은 각 제약이 메시지를 직접 들고 있어 여기 올 일이 없지만,
# 값을 타입으로 바꾸다 실패하는 바인딩 오류(enum·숫자·날짜)는 제약 이전 단계라 메시지가 없다.
# 그대로 두면 Spring 이 만든 원문 영어 예외 문구가 사용자 화면까지 새어 나간다
# (MK4-1 CP5 실측: 기간 값에 목록 밖 문자열을 direct POST 하니
#  "Failed to convert value of type 'java.lang.String' to required type ..." 이 그대로 노출).
#
# DefaultMessageCodesResolver 가 typeMismatch.<객체>.<필드> → typeMismatch.<필드>
# → typeMismatch.<타입> → typeMismatch 순으로 찾으므로, 마지막 자리를 채워 두면
# 필드가 늘어도 항목을 함께 늘릴 필요가 없다. 특정 필드에 더 나은 문구가 필요할 때만 앞자리를 추가한다.
typeMismatch=선택할 수 없는 값입니다. 목록에 있는 값으로 다시 골라주세요.
typeMismatch.java.lang.Long=숫자로 입력해주세요.
typeMismatch.java.lang.Integer=숫자로 입력해주세요.
