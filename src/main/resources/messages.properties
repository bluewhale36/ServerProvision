# 폼 바인딩 오류 문구 (HF5)
#
# 저장소에 messages.properties 가 없어 Spring 의 기본 영어 메시지가 사용자에게 그대로 노출됐다.
# 예: 폼 마커가 빠진 직접 요청에서 배너에
#   "allowCreateDirectory - Failed to convert value of type null to required type boolean; ..."
# 이 파일을 두면 Spring Boot 의 MessageSourceAutoConfiguration 이 기본 basename(messages)으로
# 자동 등록하므로 별도 설정 클래스가 필요 없다.
#
# 해석 순서는 typeMismatch.<객체>.<필드> -> typeMismatch.<필드> -> typeMismatch.<타입> -> typeMismatch 다.
# 아래는 타입 단위까지만 둔다. 필드별 한국어 라벨 사전은 MK4 레이아웃 개편에서 화면과 함께 정한다.

typeMismatch=입력값의 형식이 올바르지 않습니다.
typeMismatch.java.lang.Boolean=예 / 아니오 로 지정해야 하는 항목입니다.
typeMismatch.boolean=예 / 아니오 로 지정해야 하는 항목입니다.
typeMismatch.java.lang.Integer=정수를 입력해야 하는 항목입니다.
typeMismatch.int=정수를 입력해야 하는 항목입니다.
typeMismatch.java.lang.Long=정수를 입력해야 하는 항목입니다.
typeMismatch.long=정수를 입력해야 하는 항목입니다.
typeMismatch.java.lang.Enum=허용된 값 중에서 골라야 하는 항목입니다.

# 값이 아예 전달되지 않은 경우
required=필수 항목입니다.
methodInvocation=입력값을 처리하지 못했습니다.

# ─────────────────────────── 필드별 문구 (MK4-1) ───────────────────────────
#
# 위 HF5 주석이 예고한 "필드별 한국어 라벨 사전" 의 첫 항목이다.
#
# 타입 단위의 기본 문구는 어떤 형식이 틀렸는지만 알려준다. 그런데 보관 기간처럼 화면에서 목록으로
# 고르는 항목은 사용자가 형식을 직접 타이핑한 적이 없어 "형식이 올바르지 않다" 가 와닿지 않는다.
# 이 자리에서 실제로 일어나는 일은 목록 밖의 값이 전달된 것이므로 그렇게 말해 준다.
# (MK4-1 CP5 실측: 기간 값에 목록 밖 문자열을 direct POST 하니 Spring 원문
#  "Failed to convert value of type 'java.lang.String' to required type ..." 이 그대로 노출됐다.
#  HF5 의 사전이 들어오면서 그 영어 노출 자체는 이미 막혔고, 여기서는 문구를 상황에 맞춘다.)
#
# 열거형은 DefaultMessageCodesResolver 가 typeMismatch.<타입> 자리에 구체 enum 의 전체 이름을 넣으므로
# 위의 typeMismatch.java.lang.Enum 으로는 걸리지 않는다. 객체 · 필드 자리를 쓰는 이유가 이것이다.
typeMismatch.driftSnoozeRequest.window=선택할 수 없는 값입니다. 목록에 있는 값으로 다시 골라주세요.

# ---- E2-1-a — 펌웨어 버전 순서 (management.firmware.rank.*) --------------------
# 순서 SSOT: 목록 맨 위 = 최신. 드래그 저장은 XHR(PATCH)이라 실패 문구는 data-* 로 JS 에 전달된다.
management.firmware.rank.hint=드래그하여 버전 순서 조정
management.firmware.rank.save-failed=순서 저장에 실패했습니다 — 화면을 새로 고친 뒤 다시 시도하십시오.

# ---- E2-1-b — 펌웨어 갱신 준비도 (provisioning.firmware.*) ---------------------
# 카드 제목 · 등급 라벨 · 대기 안내. 축별 사유 문구는 FirmwareAxisReason 이 보유한다(사유가 곧 문구).
provisioning.firmware.plan.title=펌웨어 갱신 계획
provisioning.firmware.plan.hint=이 서버가 펌웨어 갱신 단계에 들어갈 때 적용할 대상입니다. 자원 상태에 따라 매번 다시 판정합니다.
provisioning.firmware.plan.holding=자원이 갖춰지기를 기다리는 중입니다 — 남은 시간 안에 자원을 되살리면 자동으로 재개합니다.
provisioning.firmware.plan.remaining=대기 잔여
# 재시도 차단 안내(E2-1-b CP5 F-2) — 내부 결정 번호 · 영문 용어를 사용자 문구에서 걷어낸다.
provisioning.retry.blocked.tooltip=펌웨어를 쓰는 도중 실패한 서버는 원인을 확인하기 전에 다시 시도할 수 없습니다. 장비가 부팅하지 못하는 상태가 될 수 있습니다.
provisioning.firmware.plan.expired=대기 시한이 지났습니다 — 다음 부팅에서 실패로 처리됩니다.

# ---- E2-2 — 펌웨어 집행 (provisioning.firmware.flash.*) ------------------------
# 계획 카드가 "무엇을" 이라면 집행 카드는 "어디까지" 다. 축별 상태 라벨은 AxisFlashState 가 보유한다.
provisioning.firmware.flash.title=펌웨어 집행
provisioning.firmware.flash.hint=축마다 따로 굽고 따로 확인합니다. 전원은 한 번만 껐다 켭니다.
# 실패로 멈췄을 때 전원이 꺼진 채라는 사실을 알린다(E2-2 D-10) — 운영자가 장비 앞에 갔을 때 당황하지 않도록.
provisioning.firmware.flash.powered-off=이 서버는 지금 꺼져 있습니다. 굽다 멈춘 상태라 자동으로 켜지 않습니다 — 원인을 확인한 뒤 재시도하거나 직접 전원을 넣으십시오.

# ---- E2-4 — 집행 현황 상세화 ----------------------------------------------------
provisioning.firmware.setting.title=펌웨어 설정 적용
provisioning.firmware.setting.hint=BIOS · BMC 표준 설정을 축마다 따로 적용하고 따로 확인합니다. 적용과 확인은 서버가 BMC 로 수행합니다.
# 굽는 창의 게스트 침묵은 고장이 아니라 설계(전원 차단)다 — '끊어짐' 표기가 부르던 오해의 정정(decisions 8).
provisioning.contact.flashing=집행 중 · 전원 꺼짐
# 목록 열은 좁아 전체 문구가 잘린다(CP5 F-1) — 축약 라벨 + tooltip 으로 나눈다.
provisioning.contact.flashing.short=집행 중

