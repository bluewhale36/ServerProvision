<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--
  MK4-3-1. 자원 무결성 점검 운영 설정.
  ─────────────────────────────────────────────────────────
  Model:
    settings     : ReconciliationSettingsResponse — 현재 값 + 자동 처리 후보 + 항목 설명
    settingsForm : ReconciliationSettingsRequest  — 폼 바인딩 대상(검증 실패 시 입력값 보존)

  배치와 디자인은 최소로 둔다 — MK4-4 가 화면을 전면 개편하므로 휴지통 설정 화면의
  폼 관례(n-form-group / n-form-banner)를 그대로 쓰고 새 배치를 고안하지 않는다.

  항목 설명 문구는 템플릿이 짓지 않는다. ReconciliationSettingItem 이 들고 있는 것을
  응답이 실어 오며, 화면은 그것을 그대로 보여 준다 — 문서 · 화면 · 코드가 같은 문장을 본다.
-->
<head>
    <th:block th:replace="~{fragments/layout :: commonHead('점검 운영 설정')}"></th:block>
</head>
<body>
<nav th:replace="~{fragments/layout :: navbar('reconciliation')}"></nav>

<div class="n-page">
    <div class="n-page-header">
        <h1 class="n-page-title">점검 운영 설정</h1>
        <div class="n-header-actions">
            <a class="n-btn n-btn-outline" th:href="@{/maintenance/reconciliation}">점검 화면으로</a>
        </div>
    </div>

    <div th:if="${param.saved != null}" class="n-banner n-banner-info">저장했습니다.</div>

    <!--/* 저장돼 있으나 코드에 없는 종류 — 조용히 버리지 않고 드러낸다. 저장하면 정리된다. */-->
    <div th:if="${!settings.unknownKinds.isEmpty()}" class="n-banner n-banner-warn">
        <strong>알 수 없는 항목이 설정에 남아 있습니다.</strong>
        지금 코드에 없는 드리프트 종류라 자동 처리에서 제외되고 있습니다 —
        <span th:text="${#strings.listJoin(settings.unknownKinds, ', ')}"></span>.
        아래에서 저장하면 정리됩니다.
    </div>

    <form id="reconciliationSettingsForm"
          th:action="@{/maintenance/reconciliation/settings}"
          th:object="${settingsForm}"
          method="post"
          data-native-submit="검증 실패 시 서버가 폼을 다시 렌더한다">

        <div class="n-form-banner n-alert n-alert-danger" role="alert"
             th:if="${#fields.hasErrors('*')}">
            <ul style="margin:0; padding-left:18px;">
                <li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
            </ul>
        </div>

        <!--/* 항목마다 뜻과 효과 시점을 함께 보인다. 두 값 모두 항목 카탈로그에서 온다. */-->
        <div class="n-form-group" th:each="item : ${settings.items}"
             th:if="${item.name == 'AUTO_APPLY_KINDS'}">
            <label class="n-form-label" th:text="${item.label}"></label>
            <p class="n-form-hint" th:text="${item.description}"></p>
            <p class="n-form-hint" style="margin-top:0">
                <strong>효과 시점</strong> : <span th:text="${item.effectTiming}"></span>
            </p>

            <p class="n-error" th:if="${#fields.hasErrors('autoApplyKindsKnown')}"
               th:errors="*{autoApplyKindsKnown}"></p>

            <!--/* 후보 목록은 종류의 해결 등급에서 파생한다 — 화면에 종류 이름을 하드코딩하지 않으므로
                 자동 처리 등급의 종류가 늘면 여기 저절로 나타난다. */-->
            <div th:each="candidate : ${settings.autoApplyCandidates}"
                 style="display:flex; align-items:flex-start; gap:8px; padding:8px 0; border-bottom:1px solid var(--n-border);">
                <input type="checkbox" th:field="*{autoApplyKinds}" th:value="${candidate.name}"
                       th:id="'kind-' + ${candidate.name}" style="margin-top:3px">
                <label th:for="'kind-' + ${candidate.name}" style="flex:1; cursor:pointer;">
                    <span style="font-weight:600" th:text="${candidate.label}"></span>
                    <span class="n-badge" style="margin-left:6px"
                          th:classappend="${candidate.reversible} ? 'n-badge-gray' : 'n-badge-red'"
                          th:text="${candidate.reversible} ? '되돌릴 수 있음' : '되돌릴 수 없음'"></span>
                    <span class="n-form-hint" style="display:block; margin:2px 0 0"
                          th:text="${candidate.resolveAction}"></span>
                    <span class="n-form-hint" style="display:block; margin:2px 0 0; color:var(--n-red)"
                          th:if="${!candidate.reversible}">되돌릴 수 없는 처리를 무인으로 맡기게 됩니다.</span>
                </label>
            </div>
        </div>

        <div class="n-form-group" th:each="item : ${settings.items}"
             th:if="${item.name == 'RESOLUTION_ENABLED'}">
            <label class="n-form-label" th:text="${item.label}"></label>
            <p class="n-form-hint" th:text="${item.description}"></p>
            <p class="n-form-hint" style="margin-top:0">
                <strong>효과 시점</strong> : <span th:text="${item.effectTiming}"></span>
            </p>
            <label style="display:flex; align-items:center; gap:8px;">
                <input type="checkbox" th:field="*{resolutionEnabled}">
                <span>시스템 해결 허용</span>
            </label>
        </div>

        <div class="n-form-group" th:each="item : ${settings.items}"
             th:if="${item.name == 'REPORT_RETENTION_COUNT'}">
            <label class="n-form-label" for="reportRetentionCount" th:text="${item.label}"></label>
            <p class="n-form-hint" th:text="${item.description}"></p>
            <p class="n-form-hint" style="margin-top:0">
                <strong>효과 시점</strong> : <span th:text="${item.effectTiming}"></span>
            </p>
            <input type="number" id="reportRetentionCount" class="n-input" min="1" max="10000"
                   th:field="*{reportRetentionCount}">
            <p class="n-error" th:if="${#fields.hasErrors('reportRetentionCount')}"
               th:errors="*{reportRetentionCount}"></p>
        </div>

        <div class="n-form-group" th:each="item : ${settings.items}"
             th:if="${item.name == 'EXTRA_SCAN_ROOTS'}">
            <label class="n-form-label" for="extraScanRoots" th:text="${item.label}"></label>
            <p class="n-form-hint" th:text="${item.description}"></p>
            <p class="n-form-hint" style="margin-top:0">
                <strong>효과 시점</strong> : <span th:text="${item.effectTiming}"></span>
                · 한 줄에 하나씩, 절대 경로로 입력합니다. 아직 없는 경로도 미리 등록할 수 있습니다.
            </p>
            <textarea id="extraScanRoots" class="n-input" rows="4"
                      th:field="*{extraScanRoots}"
                      placeholder="/mnt/backup/iso"></textarea>
            <!--/* 형식 검증은 여러 줄을 한꺼번에 보는 것이라 클래스 수준 규칙(@AssertTrue)으로 두었다.
                 그 오류는 필드가 아니라 파생 이름에 붙으므로, 필드 옆에 보이게 하려면 여기서 함께
                 그려야 한다 — 안 그리면 상단 요약에만 나와 어느 칸이 문제인지 보이지 않는다. */-->
            <p class="n-error" th:if="${#fields.hasErrors('extraScanRoots')}"
               th:errors="*{extraScanRoots}"></p>
            <p class="n-error" th:if="${#fields.hasErrors('extraScanRootsValid')}"
               th:errors="*{extraScanRootsValid}"></p>
        </div>

        <div class="n-form-group" th:each="item : ${settings.items}"
             th:if="${item.name == 'STARTUP_SCAN_ENABLED'}">
            <label class="n-form-label" th:text="${item.label}"></label>
            <p class="n-form-hint" th:text="${item.description}"></p>
            <p class="n-form-hint" style="margin-top:0">
                <strong>효과 시점</strong> : <span th:text="${item.effectTiming}"></span>
            </p>
            <label style="display:flex; align-items:center; gap:8px;">
                <input type="checkbox" th:field="*{startupScanEnabled}">
                <span>기동 직후 한 번 점검</span>
            </label>
        </div>

        <!--/*
          MK4-3-2 — 주기 둘이 읽기 전용에서 폼 안으로 들어왔다. 구조가 같은 항목이라 한 조각을
          반복해 그린다 — 두 벌을 복붙하면 한쪽만 고치는 사고가 난다. 그래서 응답이 폼 필드 이름까지
          값으로 실어 오고, th:field 는 표현식 전처리(__${...}__)로 그 이름을 받는다.

          값과 함께 다음 점검 예정 시각을 밝히는 것이 이 블록의 요점이다 — 저장한 값을 되비추는
          것만으로는 "그래서 다음에 언제 보는가" 에 답이 되지 않는다.
        */-->
        <div class="n-form-group" th:each="d : ${settings.schedule.depths}">
            <label class="n-form-label" th:for="${d.fieldName}" th:text="${d.item.label}"></label>
            <p class="n-form-hint" th:text="${d.item.description}"></p>
            <p class="n-form-hint" style="margin-top:0">
                <strong>효과 시점</strong> : <span th:text="${d.item.effectTiming.label}"></span>
            </p>

            <div style="display:flex; align-items:center; gap:8px;">
                <input type="number" class="n-input" style="max-width:140px"
                       th:id="${d.fieldName}" th:field="*{__${d.fieldName}__}"
                       required
                       th:min="${settings.schedule.minMinutes}"
                       th:max="${settings.schedule.maxMinutes}">
                <span>분</span>
                <span class="n-form-hint" style="margin:0" th:text="'현재 ' + ${d.text}"></span>
            </div>
            <p class="n-error" th:if="${#fields.hasErrors(d.fieldName)}"
               th:errors="*{__${d.fieldName}__}"></p>

            <!--/* 기준이 될 기록이 없으면 예정이 아니라 밀린 상태다 — 그렇게 말해야 사실이다. */-->
            <p class="n-form-hint" style="margin-top:6px">
                <span th:if="${d.lastScanAt != null}">
                    마지막 <span th:text="${d.depth.label}"></span> :
                    <strong th:text="${#temporals.format(d.lastScanAt, 'yyyy-MM-dd HH:mm')}"></strong> ·
                </span>
                <span th:if="${d.nextDueAt != null}">
                    다음 예정 :
                    <strong th:text="${#temporals.format(d.nextDueAt, 'yyyy-MM-dd HH:mm')}"></strong>
                </span>
                <span th:if="${d.nextDueAt == null}">기록이 없어 곧 한 번 돕니다.</span>
            </p>

            <!--/* 막지 않고 알리기만 한다. 겹친 회차는 건너뛰어질 뿐 무엇도 깨지지 않으므로 거절할
                 근거가 못 된다. 근거가 추측이 아니라 이 설치 환경의 실측값이라는 점이 이 문구의 값이다. */-->
            <p class="n-form-hint" style="color:var(--n-yellow); margin-top:4px" th:if="${d.warning}">
                지난 <span th:text="${d.depth.label}"></span>은
                <strong th:text="${d.lastDurationText}"></strong> 걸렸습니다.
                주기를 그보다 짧게 두면 일부 회차가 건너뛰어집니다.
            </p>
        </div>

        <div class="n-form-actions">
            <button type="submit" class="n-btn n-btn-primary">저장</button>
        </div>
    </form>
</div>
</body>
</html>
