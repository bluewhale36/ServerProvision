<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--
  MK1. 자원 무결성 점검 — 첫 화면 (MK4-4-2 에서 정보구조 개편)
  ─────────────────────────────────────────────────────────
  들어오면 <b>지금 남은 드리프트</b>가 급한 순으로 먼저 보인다
  (PathReconciliationService.openDrifts — DriftPriority 정렬). 하나를 열면 드리프트 상세로 가고,
  겹은 하나다. 점검 이력은 부차로 밀려 별도 화면(/reports)에서 본다.

  종전 Miller 3 컬럼을 이 배치로 바꾼 근거는 진단이다 — 이 도메인에서 운영자가 실제로 하는 일은
  이력 탐색이 아니라 지금 미해결인 것들을 급한 순서로 처리하는 것인데, 구조가 그 일을 반영하지
  못하니 개별 항목을 아무리 고쳐도 같은 마찰이 남았다. 배치 후보 둘을 실제 화면으로 만들어
  견준 뒤 이쪽을 채택했다(MK4-4-2).

  Model: openDrifts · openDriftCount · openBulkTargetCount · latestReport (+ 공통 배너)
-->
<head>
    <th:block th:replace="~{fragments/layout :: commonHead('자원 무결성 점검')}"></th:block>
    <th:block th:replace="~{fragments/maintenance/reconciliation-parts :: styles}"></th:block>
</head>
<body>
<nav th:replace="~{fragments/layout :: navbar('reconciliation')}"></nav>

<div class="n-page">
    <div class="n-page-header">
        <div>
            <h1 class="n-page-title">자원 무결성 점검</h1>
            <!--/* 마지막 점검 시각은 화면의 주인공이 아니라 배경이다. 배너로 두었더니 미해결
                 목록 위에 한 칸을 차지해, 정작 처리해야 할 것보다 먼저 눈에 들어왔다.
                 제목 아래 보조 텍스트로 내려 "언제 본 것인가" 만 조용히 말하게 한다. */-->
            <div th:if="${latestReport != null}" class="n-page-subtext n-text-muted">
                마지막 점검
                <strong th:text="${#temporals.format(latestReport.scannedAt, 'yyyy-MM-dd HH:mm')}"></strong>
                <span th:if="${latestReport.deep}">(정밀)</span>
                <span th:text="|· 점검 대상 ${latestReport.population.total()}건 · 그때 탐지 ${latestReport.detectedDriftCount}건|"></span>
            </div>
            <div th:if="${latestReport == null}" class="n-page-subtext n-text-muted">
                아직 점검한 적이 없습니다.
            </div>
        </div>
        <div th:replace="~{fragments/maintenance/reconciliation-parts :: scanActions}"></div>
    </div>

    <th:block th:replace="~{fragments/maintenance/reconciliation-parts :: banners}"></th:block>

    <section class="n-card n-glist">
        <div class="n-glist-head">
            <strong class="n-glist-title">지금 남은 드리프트</strong>
            <span class="n-glist-hint">급한 순 — 위험도와 사용 중 여부로 매겨집니다</span>
            <span class="n-badge"
                  th:classappend="${openDriftCount > 0} ? 'n-badge-yellow' : 'n-badge-gray'"
                  th:text="|${openDriftCount} 건|">3 건</span>
            <span th:replace="~{fragments/maintenance/reconciliation-parts
                               :: bulkApplyButton(@{/maintenance/reconciliation/drifts/apply-all},
                                                  ${openBulkTargetCount},
                                                  '지금 목록에 떠 있는 드리프트 중 시스템이 해결할 수 있는 것')}"></span>
        </div>

        <div class="n-glist-panel">
            <div th:replace="~{fragments/maintenance/reconciliation-parts
                               :: driftTable(${openDrifts},
                                             '남아 있는 드리프트가 없습니다.',
                                             '마지막 점검에서 발견된 것이 모두 처리됐거나, 애초에 아무것도 나오지 않았습니다.')}"></div>
        </div>
    </section>

    <div th:replace="~{fragments/maintenance/reconciliation-parts :: adminTools}"></div>
</div>

<th:block th:replace="~{fragments/maintenance/reconciliation-parts :: tail}"></th:block>
</body>
</html>
