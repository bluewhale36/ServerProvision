<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--
  MK3. 휴지통 (Trash) 페이지
  ─────────────────────────────────────────────────────────
  Model:
    trashItems     : List<TrashItemResponse>  — 5 도메인 합본
                       · resourceType : ResourceType
                       · resourceId   : Long
                       · displayName  : String
                       · originalPath : String
                       · trashedPath  : String
                       · trashedAt    : Instant
                       · expiresAt    : Instant   (trashedAt + TTL)
                       · ttlWarning   : boolean   (7일 이내)

  액션 :
    · 복원      → 기존 도메인 endpoint `/management/<domain>/{id}/restore` 재사용
    · 영구삭제   → 기존 도메인 endpoint `/management/<domain>/{id}/purge`   재사용 (S5-2-2 typed-name)
    · 보존기간 연장 → `/maintenance/trash/{resourceType}/{resourceId}/extend`

  CP2 — 페이지 더미 + 표 스켈레톤. 도메인별 endpoint 합성 + ttl 경고 색 + 빈 상태는 CP4 에서 정밀화.
-->
<head>
    <th:block th:replace="~{fragments/layout :: commonHead('휴지통')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/table-list.css}">
    <link rel="stylesheet" th:href="@{/maintenance/trash/trash-list.css}">
</head>
<body>
<nav th:replace="~{fragments/layout :: navbar('trash')}"></nav>

<div class="n-page">
    <div class="n-page-header">
        <h1 class="n-page-title">휴지통</h1>
        <div class="n-header-actions">
            <!-- S5-2-4 — 운영 설정 / 감사 로그 페이지 진입점. S5-5 — 이모지 제거. -->
            <a th:href="@{/maintenance/trash/settings}"
               class="n-btn n-btn-secondary n-btn-sm">운영 설정</a>
            <a th:href="@{/maintenance/trash/purge-log}"
               class="n-btn n-btn-secondary n-btn-sm">감사 로그</a>
        </div>
    </div>

    <!--/* 빈 상태 */-->
    <th:block th:if="${#lists.isEmpty(trashItems)}">
        <div th:replace="~{fragments/ui/empty :: state(title='휴지통이 비어 있습니다.', desc=null)}"></div>
    </th:block>

    <!--/* 자원 목록 */-->
    <div class="n-table-scroll" th:if="${not #lists.isEmpty(trashItems)}">
        <table class="n-table">
            <thead>
            <tr>
                <th>자원 종류</th>
                <th>자원 ID</th>
                <th>자원 이름</th>
                <th>원래 경로</th>
                <th>휴지통 이동 시각</th>
                <th>보존 만료 시각</th>
                <th>처리</th>
            </tr>
            </thead>
            <tbody>
            <!--/* MK4-5-1 CP7 — 화면 이력 스택(global/nav-stack.js)의 규약. 행에 이 키가 있어야
                   행 안의 링크를 누를 때 한 겹 쌓이고, 상세의 [목록으로] 가 여기로 되돌아온다.
                   키가 없으면 스택이 비어 상세가 서버 렌더 기본 href(점검 목록)로 가 버린다 —
                   휴지통에서 들어갔는데 점검 목록으로 나오던 것이 그 때문이었다.
                   키는 이 목록의 좌표계다. 자원 종류와 번호의 조합이 행을 유일하게 짚는다. */-->
            <tr th:each="item : ${trashItems}"
                th:data-nav-key="|${item.resourceType}#${item.resourceId}|">
                <td>
                    <span class="n-badge n-badge-gray" th:text="${item.resourceType.displayName}"></span>
                    <!--/* MK4-5-1 — 복원이 막힌 행은 왼쪽에서 바로 보인다. 라벨 · 색 · 안내 문구를
                           RestoreBlockReason 이 함께 들고 있어 여기에 사유별 분기도 문구도 없다.
                           종전에는 유령 기록만 배지가 있었고 그 색이 인라인 스타일이었다. */-->
                    <span th:if="${item.showsBlockBadge()}" class="n-badge trash-block-badge"
                          th:classappend="'n-badge-' + ${item.restoreBlock.badgeColor}"
                          th:title="${item.restoreBlock.guidance}"
                          th:text="${item.restoreBlock.label}">복구 불가</span>
                    <!--/* 막힌 이유를 다른 화면에서 풀어야 할 때만. 링크가 없어도 차단은 유지되므로
                           점검이 아직 못 본 상태는 그 사실을 그대로 말한다. */-->
                    <a th:if="${item.hasDriftLink()}"
                       th:href="@{/maintenance/reconciliation/drifts/{id}(id=${item.driftId})}"
                       class="trash-block-link">자세히 보기</a>
                    <span th:if="${item.awaitingScan()}" class="trash-block-hint">다음 점검에서 확인 예정</span>
                </td>
                <td th:text="${item.resourceId}"></td>
                <td>
                    <!--/* S5-2-3-1 — 자식 자원은 들여쓰기 + ↳ + 부모 표시. 부모 활성/삭제 상태 배지 동반. */-->
                    <div th:if="${item.parentResourceId != null}" class="trash-parent-line">
                        <span class="trash-parent-arrow">↳</span>
                        <span class="trash-parent-label">
                            <span th:text="${item.parentResourceType.displayName}"
                                  class="n-badge n-badge-gray trash-parent-badge"></span>
                            <code class="trash-parent-name" th:text="${item.parentDisplayName}"></code>
                            <span th:if="${item.parentDeleted}" class="n-badge trash-parent-deleted"
                                  title="부모 자원이 삭제 상태입니다. 부모부터 복구해야 합니다.">부모 삭제 상태</span>
                        </span>
                    </div>
                    <code class="trash-resource-name"
                          th:classappend="${item.parentResourceId != null} ? 'trash-child-name' : ''"
                          th:text="${item.displayName}"></code>
                </td>
                <td>
                    <code class="trash-path" th:text="${item.originalPath}"></code>
                </td>
                <td>
                    <span th:if="${item.trashedAt != null}"
                          th:text="${#temporals.format(item.trashedAt, 'yyyy-MM-dd HH:mm:ss')}"></span>
                    <span th:if="${item.trashedAt == null}" class="trash-empty-value">-</span>
                </td>
                <td>
                    <span th:if="${item.expiresAt != null}"
                          th:text="${#temporals.format(item.expiresAt, 'yyyy-MM-dd HH:mm:ss')}"></span>
                    <span th:if="${item.expiresAt == null}" class="trash-empty-value">-</span>
                    <strong th:if="${item.ttlWarning}" class="trash-expiry-warning">곧 영구 삭제</strong>
                </td>
                <td class="trash-action-cell">
                    <div class="trash-action-group">
                        <!--/* MK3-1 — ghost 행은 "정리" 액션 1개만. 복원/연장/영구삭제 disabled. */-->
                        <!-- ghost row 정리는 DB row 만 제거 (복구 가능 자원 없음). typed-name 불요 — 단순 soft-delete 마커 유지. -->
                        <form th:if="${item.ghost}"
                              th:action="@{/maintenance/trash/{rt}/{rid}/clear-ghost(rt=${item.resourceType}, rid=${item.resourceId})}"
                              method="post"
                              data-confirm-soft-delete=""
                              th:data-resource-label="|${item.resourceType.displayName} #${item.resourceId} 유령 기록|"
                              data-resource-extra="복구할 파일이 없는 기록만 지웁니다.">
                            <button type="submit" class="n-btn n-btn-sm n-btn-outline-danger">정리</button>
                        </form>

                        <!--/* 정상 trash 자원 — 기존 3 액션 그대로. 부모 메타 자원 (OS_IMAGE/BOARD_MODEL) 은 cascade 라디오 노출. */-->
                        <th:block th:unless="${item.ghost}">
                            <form th:action="@{/maintenance/trash/{rt}/{rid}/restore(rt=${item.resourceType}, rid=${item.resourceId})}"
                                  method="post"
                                  data-confirm-restore=""
                                  th:data-resource-label="${item.displayName}"
                                  th:data-resource-extra="${item.resourceType.metadata} ? null : '원래 경로로 복구합니다.'"
                                  th:attr="data-cascade-true-title=${item.childPreview != null ? '하위 자원도 함께 복구' : null},
                                       data-cascade-true-desc=${item.childPreview}">
                                <!-- MK4-5-1 — 차단 사유가 셋으로 늘었고, 판정과 문구를 모두
                                     RestoreBlockReason 이 든다. 종전에는 부모 삭제만 막았고 그 안내
                                     문구가 이 템플릿에 하드코딩돼 있었다 — 사유가 늘 때마다 여기에
                                     조건이 하나씩 붙고 문구가 흩어지는 구조였다.
                                     테이블 오른쪽 끝 액션 컬럼이라 tooltip 잘림 방지 위해 우측 정렬. -->
                                <span class="n-btn-tooltip-wrap"
                                      data-tooltip-align="right"
                                      th:attr="data-tooltip=${item.restoreBlocked()} ? ${item.restoreBlock.guidance} : null">
                                <button type="submit" class="n-btn n-btn-sm n-btn-primary"
                                        th:disabled="${item.restoreBlocked()}">복구</button>
                            </span>
                            </form>
                            <!-- HF4-1 — 연장 전용 modal 마커(data-confirm-extend) + step 라벨 동적화. -->
                            <!--    미지원 자원 종류(메타 자원)는 disabled + tooltip 으로 UI 1차 차단 —
                                    ttlExtendable 은 서버 가드와 동일한 SPI 판정(supportsTrashTtlExtension) SSOT. -->
                            <form th:action="@{/maintenance/trash/{rt}/{rid}/extend(rt=${item.resourceType}, rid=${item.resourceId})}"
                                  method="post"
                                  data-confirm-extend=""
                                  th:data-resource-type="${item.resourceType}"
                                  th:data-resource-id="${item.resourceId}"
                                  th:data-resource-label="|${item.displayName} 의 보존 기간|"
                                  th:data-extend-step-days="${item.extendStepDays}"
                                  data-resource-extra="만료일에 더합니다.">
                                <span class="n-btn-tooltip-wrap"
                                      data-tooltip-align="right"
                                      th:attr="data-tooltip=${!item.ttlExtendable} ? '이 자원 종류는 보존 기간을 연장할 수 없습니다.' : null">
                                <button type="submit" class="n-btn n-btn-sm n-btn-outline"
                                        th:disabled="${!item.ttlExtendable}"
                                        th:text="|+${item.extendStepDays}일 연장|">+30일 연장</button>
                            </span>
                            </form>
                            <!-- S5-2 — typed-name 검증 적용 영구삭제. S5-6-1 — typed-name expected 는 BE 가 modal trigger 시 응답. -->
                            <form th:action="@{/maintenance/trash/{rt}/{rid}/purge(rt=${item.resourceType}, rid=${item.resourceId})}"
                                  method="post"
                                  data-confirm-purge=""
                                  th:data-resource-type="${item.resourceType}"
                                  th:data-resource-id="${item.resourceId}"
                                  th:data-resource-label="${item.displayName}"
                                  data-resource-extra="휴지통에서 제거되며 복구할 수 없습니다.">
                                <!--/* HF26 — 참조가 남은 메인보드는 영구삭제를 먼저 막는다. 사유는 서버 가드와 같은 문자열(BoardModelPurgeGuard). */-->
                                <span class="n-btn-tooltip-wrap"
                                      data-tooltip-align="right"
                                      th:attr="data-tooltip=${item.purgeBlocked} ? ${item.purgeBlockReason} : null">
                                <button type="submit" class="n-btn n-btn-sm n-btn-outline-danger"
                                        th:disabled="${item.purgeBlocked}">영구 삭제</button>
                                </span>
                            </form>
                        </th:block>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- S5-2 — 4 종 자원 상태 변경 modal 묶음 + 공통 script 통합. -->
<!-- S5-6-1 — confirm-purge 만 lazy-load. -->
<div th:replace="~{fragments/management/confirm-modals :: lazyShell}"></div>

<!-- S5-6-3 — 휴지통 결과 안내 modal 도 lazy-load. trash-result-modal :: modal 사전 include 제거. -->
<script th:src="@{/maintenance/trash/trash-action.js}"></script>

</body>
</html>
