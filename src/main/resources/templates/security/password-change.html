<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--
  S18 — 비밀번호 변경. 초기 비밀번호로 첫 로그인한 사용자(?first=1 · forced)는 이 화면을 끝내기 전에는 다른 화면으로 갈 수 없다
  (MustChangePasswordInterceptor). 자발 변경도 같은 화면이다.
  Model: passwordForm(PasswordChangeRequest) · forced
-->
<head>
    <th:block th:replace="~{fragments/layout :: commonHead('비밀번호 변경')}"></th:block>
</head>
<body>
<nav th:replace="~{fragments/layout :: navbar('password')}"></nav>

<div class="n-page-md">
    <div class="n-page-header">
        <h1 class="n-page-title">비밀번호 변경</h1>
    </div>

    <div th:if="${forced}" class="n-alert n-alert-warning" role="alert">초기 비밀번호로 로그인했습니다. 계속하려면 비밀번호를 바꾸십시오.</div>

    <div class="n-card">
        <div class="n-card-body">
            <form th:action="@{/password/change(first=${forced} ? '1' : null)}" th:object="${passwordForm}" method="post" novalidate
                  data-native-submit="검증 실패 시 같은 뷰를 다시 렌더한다(BindingResult · 필드 오류)">
                <div class="n-form-group">
                    <label class="n-label strong" for="currentPassword">현재 비밀번호</label>
                    <input id="currentPassword" type="password" name="currentPassword" class="n-input" autocomplete="current-password"
                           data-error-field="currentPassword"
                           th:classappend="${#fields.hasErrors('currentPassword')} ? 'is-invalid'">
                    <div class="n-error" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></div>
                </div>
                <div class="n-form-group">
                    <label class="n-label strong" for="newPassword">새 비밀번호</label>
                    <input id="newPassword" type="password" name="newPassword" class="n-input" autocomplete="new-password"
                           data-error-field="newPassword"
                           th:classappend="${#fields.hasErrors('newPassword') or #fields.hasErrors('newPasswordDifferent')} ? 'is-invalid'">
                    <div class="n-hint">영문 대소문자 · 숫자 · 특수기호(! @ # $ % ^ &amp; * ( ) - _ = + . , ?)로 8자 이상 72자 이하입니다.</div>
                    <div class="n-error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
                    <div class="n-error" th:if="${#fields.hasErrors('newPasswordDifferent')}" th:errors="*{newPasswordDifferent}"></div>
                </div>
                <div class="n-form-group">
                    <label class="n-label strong" for="retypedPassword">새 비밀번호 확인</label>
                    <input id="retypedPassword" type="password" name="retypedPassword" class="n-input" autocomplete="new-password"
                           data-error-field="retypedPassword"
                           th:classappend="${#fields.hasErrors('retypedPassword') or #fields.hasErrors('newPasswordConfirmed')} ? 'is-invalid'">
                    <div class="n-error" th:if="${#fields.hasErrors('retypedPassword')}" th:errors="*{retypedPassword}"></div>
                    <div class="n-error" th:if="${#fields.hasErrors('newPasswordConfirmed')}" th:errors="*{newPasswordConfirmed}"></div>
                </div>
                <div class="n-form-actions">
                    <a th:unless="${forced}" th:href="@{/provisioning/server}" class="n-btn n-btn-secondary">취소</a>
                    <button type="submit" class="n-btn n-btn-primary">비밀번호 변경</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
