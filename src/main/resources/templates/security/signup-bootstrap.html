<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--
  S18 — 최초 관리자 등록(부트스트랩 모드). 관리자가 하나도 없을 때만 열리며(SignupAccessPolicy), 만드는 계정은 ADMIN 으로 고정된다.
  폼은 fragments/security/signup-form 하나를 관리자 모드 화면과 공유한다.
-->
<head>
    <th:block th:replace="~{fragments/layout :: commonHead('최초 관리자 등록')}"></th:block>
    <link rel="stylesheet" th:href="@{/global/auth.css}">
</head>
<body>
<main class="n-auth">
    <div class="n-card n-auth-card">
        <div class="n-card-body">
            <p class="n-auth-brand">Provision Portal</p>
            <h1 class="n-auth-title">최초 관리자 등록</h1>
            <p class="n-auth-lead">관리자 계정이 아직 없습니다. 지금 만드는 계정이 관리자가 되며, 이후의 사용자 등록은 관리자만 할 수 있습니다.</p>
            <th:block th:replace="~{fragments/security/signup-form :: signupForm}"></th:block>
            <p class="n-auth-foot"><a th:href="@{/login}">로그인으로</a></p>
        </div>
    </div>
</main>
</body>
</html>
