<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--
  A1. OS 메타데이터 신규 등록 폼
  ─────────────────────────────────────────────────────────
  MK2 WAVE 1 — XHR JSON 제출.
    · POST /management/os 가 200/{redirect} 또는 409 JSON 으로 응답.
    · HF30-1 — 같은 (OSName, osVersion) 이 어느 상태로든 있으면 409 가 상태별 다음 행동(복구 · 영구 삭제 · Deprecated 해제)을
      안내하고 배너에 뜬다. 중복 확인 창은 없앴다(메인보드 HF26 과 같은 규칙).

  Model:
    osMetadataForm : OSMetadataCreateRequest   @ModelAttribute (BindingResult 대상)
    osOptions     : List<OsRegistrationOption>  OS 선택지. Rocky Linux 는 지원 메이저마다 한 줄(E4-1-b-2 D-21, 정본 RhelRelease)
-->
<head>
    <th:block th:replace="~{fragments/layout :: commonHead('OS 버전 등록')}"></th:block>
</head>
<body>
<nav th:replace="~{fragments/layout :: navbar('os-metadata')}"></nav>

<div class="n-page-md">
    <div class="n-page-header">
        <h1 class="n-page-title">OS 버전 등록</h1>
        <div class="n-header-actions">
            <a th:href="@{/management/os}" class="n-back-link"><svg th:replace="~{fragments/icon :: icon('arrow-left')}"></svg>목록으로</a>
        </div>
    </div>

    <div class="n-card">
        <div class="n-card-body">
            <form id="osMetadataForm"
                  th:action="@{/management/os}"
                  th:object="${osMetadataForm}"
                  method="post"
                  novalidate>

                <!-- S4 폼 배너 슬롯 -->
                <div class="n-form-banner n-alert n-alert-danger" role="alert" hidden></div>

                <!-- OS 이름 : 신규 등록 시에만 선택 가능 (수정 화면에선 고정). 지원 OS 상수 하나가 한 줄이고,
                     고른 줄의 data-version-prefill 을 버전 칸에 채운다(os-metadata-new.js, S23-1). -->
                <div class="n-form-group">
                    <label class="n-label strong" for="osName">OS 이름</label>
                    <select id="osName" name="osName" class="n-select" data-error-field="osName">
                        <option value="">선택</option>
                        <option th:each="opt : ${osOptions}"
                                th:value="${opt.osName.name()}"
                                th:text="${opt.label}"
                                th:selected="${opt.osName == osMetadataForm.osName}"
                                th:attr="data-version-prefill=${opt.versionPrefill},data-version-locked=${opt.versionLocked}"></option>
                    </select>
                </div>

                <div class="n-form-group" data-error-field="osVersionAccepted">
                    <label class="n-label strong" for="osVersion">OS 버전</label>
                    <input id="osVersion" type="text" name="osVersion"
                           class="n-input"
                           data-error-field="osVersion"
                           placeholder="예: 9.6">
                    <div class="n-hint" id="osVersionHint" hidden>세부 버전까지 입력합니다. 예: <span id="osVersionExample">9.6</span></div>
                </div>

                <div class="n-form-group">
                    <label class="n-label" for="description">설명 (선택)</label>
                    <textarea id="description" th:field="*{description}"
                              class="n-textarea" rows="3"
                              placeholder="예: Rocky Linux 9 최신 마이너 릴리스"></textarea>
                </div>

                <div class="n-form-actions">
                    <a th:href="@{/management/os}" class="n-btn n-btn-secondary">취소</a>
                    <button type="submit" class="n-btn n-btn-primary">등록</button>
                </div>
            </form>
        </div>
    </div>
</div>


<script th:src="@{/global/form-error.js}"></script>
<script th:src="@{/management/os/os-metadata-new.js}"></script>
</body>
</html>
