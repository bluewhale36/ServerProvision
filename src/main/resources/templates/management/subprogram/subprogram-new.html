<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: commonHead('드라이버, 유틸리티 등록')}"></th:block>
    <link rel="stylesheet" th:href="@{/management/os/os-page.css}">
</head>
<body>
<nav th:replace="~{fragments/layout :: navbar('subprogram')}"></nav>

<div class="n-page-md">
    <div class="n-page-header">
        <h1 class="n-page-title">
            <span th:text="${kindDisplayName}">드라이버</span> 등록
        </h1>
        <div class="n-header-actions">
            <a id="backLink" th:href="@{/management/subprogram}" class="n-back-link"><svg th:replace="~{fragments/icon :: icon('arrow-left')}"></svg>목록으로</a>
        </div>
    </div>

    <div class="n-card">
        <div class="n-card-body">
            <form id="subprogramForm"
                  th:data-base-url="@{/management/subprogram}"
                  th:data-kind-token="${kindToken}"
                  th:data-list-url="@{/management/subprogram}"
                  th:object="${subprogramForm}"
                  enctype="multipart/form-data"
                  novalidate>

                <!-- S4 폼 배너 슬롯 -->
                <div class="n-form-banner n-alert n-alert-danger" role="alert" hidden></div>

                <div class="n-form-group">
                    <label class="n-label strong">적용 범위</label>
                    <div class="n-check-row">
                        <label class="n-check">
                            <input type="radio" name="boardScopeMode" value="common"
                                   data-error-field="boardScopeMode"
                                   th:checked="${prefillScopeMode == 'common'}">
                            <span>공용(메인보드 무관)</span>
                        </label>
                        <label class="n-check">
                            <input type="radio" name="boardScopeMode" value="board"
                                   data-error-field="boardScopeMode"
                                   th:checked="${prefillScopeMode == 'board'}">
                            <span>특정 메인보드</span>
                        </label>
                    </div>

                    <select id="boardId" name="boardId" class="n-input n-block-gap-sm"
                            data-error-field="boardId"
                            th:disabled="${prefillScopeMode != 'board'}">
                        <option value="">메인보드 선택</option>
                        <th:block th:each="vg : ${vendorGroups}">
                            <optgroup th:label="${vg.displayName}">
                                <option th:each="b : ${vg.items}"
                                        th:value="${b.id}"
                                        th:selected="${prefillBoardId != null and prefillBoardId == b.id}"
                                        th:text="${b.modelName}"></option>
                            </optgroup>
                        </th:block>
                    </select>
                    <div class="n-hint">
                        공용은 RAID 유틸리티, 진단 프로그램처럼 메인보드와 무관한 도구에 씁니다.
                    </div>
                </div>

                <div class="n-form-group">
                    <label class="n-label strong" for="name">이름</label>
                    <input id="name" type="text" th:field="*{name}" class="n-input"
                           data-error-field="name"
                           placeholder="예: Intel ME RAID Utility / Realtek r8169 driver">
                    <div class="n-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>

                <div class="n-form-group">
                    <label class="n-label strong" for="version">버전</label>
                    <input id="version" type="text" th:field="*{version}" class="n-input"
                           data-error-field="version"
                           placeholder="예: 1.2.0">
                    <div class="n-error" th:if="${#fields.hasErrors('version')}" th:errors="*{version}"></div>
                </div>

                <div class="n-form-group">
                    <label class="n-label strong" for="osName">OS</label>
                    <select id="osName" name="osName" class="n-input" data-error-field="osName">
                        <option value="" th:text="#{management.subprogram.os.any}">OS 무관</option>
                        <option th:each="os : ${osNames}" th:value="${os.name()}" th:text="${os.label()}">Windows Server</option>
                    </select>
                    <div class="n-hint">진입점(변형)은 등록 뒤 수정 화면에서 설정합니다.</div>
                </div>

                <div class="n-form-group">
                    <label class="n-label strong" for="targetDirectory">대상 디렉토리</label>
                    <div class="n-field-row">
                        <input id="targetDirectory" type="text" th:field="*{targetDirectory}" class="n-input"
                              
                               data-error-field="targetDirectory"
                               placeholder="예: /opt/subprogram/.../1.2.0/"
                               th:data-browse-url="@{/management/browse}">
                        <button type="button" id="browseBtn" class="n-btn n-btn-outline">탐색</button>
                    </div>
                    <div class="n-hint">
                        업로드할 때는 빈 디렉토리를, 기존 디렉토리를 등록할 때는 파일이 들어 있는 디렉토리를 지정해야 합니다.
                    </div>
                    <div class="n-error" th:if="${#fields.hasErrors('targetDirectory')}"
                         th:errors="*{targetDirectory}"></div>

                    <div th:replace="~{fragments/management/directory-browse-panel :: browsePanel('browse', 'directory', null)}"></div>

                    <label class="n-check n-block-gap-sm">
                        <input type="checkbox" id="allowCreateDirectory" th:field="*{allowCreateDirectory}">
                        <span>상위 디렉토리 생성 허용</span>
                    </label>
                </div>

                <div class="n-form-group">
                    <label class="n-label strong">등록 방식</label>
                    <div class="n-check-row n-lead" role="tablist">
                        <button type="button" id="modeTabFolder" class="n-btn n-btn-sm" role="tab"
                                aria-selected="true" data-mode="FOLDER">폴더 업로드
                        </button>
                        <button type="button" id="modeTabZip" class="n-btn n-btn-sm n-btn-outline" role="tab"
                                aria-selected="false" data-mode="ZIP">Zip 업로드
                        </button>
                        <button type="button" id="modeTabSingle" class="n-btn n-btn-sm n-btn-outline" role="tab"
                                aria-selected="false" data-mode="SINGLE_FILE">단일 파일 업로드
                        </button>
                        <button type="button" id="modeTabExisting" class="n-btn n-btn-sm n-btn-outline" role="tab"
                                aria-selected="false" data-mode="EXISTING_DIRECTORY">기존 디렉토리 등록
                        </button>
                    </div>

                    <input type="hidden" id="uploadMode" name="uploadMode" value="FOLDER">

                    <div id="folderPane">
                        <input id="folderFiles" type="file" name="folderFiles" webkitdirectory multiple class="n-input">
                    </div>

                    <div id="zipPane" hidden>
                        <input id="zipFile" type="file" name="zipFile" accept=".zip" class="n-input">
                    </div>

                    <div id="singlePane" hidden>
                        <input id="singleFile" type="file" name="singleFile" class="n-input">
                    </div>

                    <div id="existingPane" hidden>
                        <div class="n-alert n-alert-muted">
                            다른 자원으로 이미 등록된 디렉토리는 등록할 수 없습니다.
                        </div>
                    </div>
                </div>

                <div class="n-form-group">
                    <label class="n-label" for="description">설명 (선택)</label>
                    <textarea id="description" th:field="*{description}"
                              class="n-textarea" rows="3"
                              data-error-field="description"
                              placeholder="자원에 대한 설명이나 출처 메모"></textarea>
                </div>

                <div class="n-form-actions">
                    <a id="cancelLink" th:href="@{/management/subprogram}" class="n-btn n-btn-secondary">취소</a>
                    <button type="submit" id="submitBtn" class="n-btn n-btn-primary">등록</button>
                </div>

                <div class="n-hint n-block-gap">
                    등록이 끝날 때까지 페이지를 떠나면 안 됩니다.
                </div>

                <div id="uploadProgress" class="n-upload-progress">
                    <div id="uploadText" class="n-upload-progress-text">시작 중…</div>
                    <div class="n-upload-progress-bar-wrap">
                        <div id="uploadBar" class="n-upload-progress-bar"></div>
                    </div>
                </div>

                <div id="uploadError" class="n-upload-error"></div>
            </form>
        </div>
    </div>
</div>
<!-- MK2 — nudge modal fragment (해시 충돌 시 사용자 3택 confirm) -->
<div th:replace="~{fragments/management/nudge-modal :: nudgeModal('subprogramNudge', '/management/subprogram/nudge')}"></div>

<script th:src="@{/management/common/bundle-upload-bootstrap.js}"></script>
<script th:src="@{/management/common/bundle-upload-shell.js}"></script>
<script th:src="@{/global/nudge-modal.js}"></script>
<script th:src="@{/management/subprogram/subprogram-new.js}"></script>
</body>
</html>
