<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--
  MA7. RAID 카드 신규 등록 폼
  ─────────────────────────────────────────────────────────
  Model:
    raidCardForm  : RaidCardCreateRequest   @ModelAttribute
                     (vendor, modelName, supportedRaidLevels, hasCache, pciSubsystemId, description)
    vendorOptions : List<RaidCardVendor>     모든 RaidCardVendor 열거형 값
    levelOptions  : List<RaidLevel>          모든 RaidLevel 열거형 값
-->
<head>
    <th:block th:replace="~{fragments/layout :: commonHead('RAID 카드 등록')}"></th:block>
</head>
<body>
<nav th:replace="~{fragments/layout :: navbar('raidcard')}"></nav>

<div class="n-page-md">
    <div class="n-page-header">
        <h1 class="n-page-title">RAID 카드 등록</h1>
        <div class="n-header-actions">
            <a th:href="@{/management/raidcard}" class="n-back-link"><svg th:replace="~{fragments/icon :: icon('arrow-left')}"></svg>목록으로</a>
        </div>
    </div>

    <div class="n-card">
        <div class="n-card-body">
            <form id="raidCardForm"
                  th:action="@{/management/raidcard}"
                  th:object="${raidCardForm}"
                  method="post"
                  novalidate>

                <!-- S4 폼 배너 슬롯 -->
                <div class="n-form-banner n-alert n-alert-danger" role="alert" hidden></div>

                <!-- 제조사 : 신규 등록 시에만 선택 가능 (수정 시 고정) -->
                <div class="n-form-group">
                    <label class="n-label strong" for="vendor">제조사</label>
                    <select id="vendor" th:field="*{vendor}" class="n-select"
                            data-error-field="vendor"
                            th:classappend="${#fields.hasErrors('vendor')} ? 'is-invalid'">
                        <option value="">선택</option>
                        <option th:each="v : ${vendorOptions}"
                                th:value="${v.name()}"
                                th:text="${v.displayName}"></option>
                    </select>
                    <div class="n-error" th:if="${#fields.hasErrors('vendor')}"
                         th:errors="*{vendor}"></div>
                </div>


                <div class="n-form-group">
                    <label class="n-label strong" for="chipFamily">칩 계열</label>
                    <select id="chipFamily" th:field="*{chipFamily}" class="n-select"
                            data-error-field="chipFamily"
                            th:classappend="${#fields.hasErrors('chipFamily')} ? 'is-invalid'">
                        <option value="">선택</option>
                        <!-- R17-2 — 계열이 만들 수 있는 레벨과 안내를 option 에 싣는다(SSOT = RaidChipFamily.creatableLevels · creatableLevelsHint). -->
                        <option th:each="cf : ${chipFamilyOptions}"
                                th:value="${cf.name()}"
                                th:text="${cf.displayName}"
                                th:data-creatable-levels="${#strings.setJoin(cf.creatableLevels(), ' ')}"
                                th:data-lock-hint="${cf.creatableLevelsHint()}"></option>
                    </select>
                    <div class="n-error" th:if="${#fields.hasErrors('chipFamily')}"
                         th:errors="*{chipFamily}"></div>
                </div>

                <div class="n-form-group">
                    <label class="n-label strong" for="modelName">모델명</label>
                    <input id="modelName" type="text" th:field="*{modelName}"
                           class="n-input"
                           data-error-field="modelName"
                           th:classappend="${#fields.hasErrors('modelName')} ? 'is-invalid'"
                           placeholder="예: CRA3338">
                    <div class="n-error" th:if="${#fields.hasErrors('modelName')}"
                         th:errors="*{modelName}"></div>
                </div>

                <!-- 지원 RAID 레벨 : 복수 선택 (최소 1개). 정의서 작성 화면의 1차 차단 재료가 된다. -->
                <div class="n-form-group">
                    <label class="n-label strong">지원 RAID 레벨</label>
                    <div class="n-check-row" data-error-field="supportedRaidLevels" data-level-group
                         th:classappend="${#fields.hasErrors('supportedRaidLevels')} ? 'is-invalid'">
                        <!-- CP6 개정 — 전체 선택/해제 master. 개별 상태에 따라 checked/indeterminate 동기화. -->
                        <label class="n-checkbox">
                            <input type="checkbox" data-level-select-all>
                            <span>전체 선택</span>
                        </label>
                        <label class="n-checkbox" th:each="lvl : ${levelOptions}">
                            <input type="checkbox" th:field="*{supportedRaidLevels}" th:value="${lvl.name()}">
                            <span th:text="${lvl.displayName}">RAID0</span>
                        </label>
                    </div>
                    <div class="n-hint">카드 데이터시트의 지원 레벨을 그대로 골라야 합니다.</div>
                    <div class="n-error" th:if="${#fields.hasErrors('supportedRaidLevels')}"
                         th:errors="*{supportedRaidLevels}"></div>
                    <!-- R17-2 — 고른 칩 계열이 만들 수 없는 레벨을 잠근 이유. 서버 교차 검증(supportedRaidLevelsCreatable) 오류도 여기 붙는다. -->
                    <div class="n-hint" data-level-lock-hint data-error-field="supportedRaidLevelsCreatable" hidden></div>
                    <div class="n-error" th:if="${#fields.hasErrors('supportedRaidLevelsCreatable')}"
                         th:errors="*{supportedRaidLevelsCreatable}"></div>
                </div>

                <div class="n-form-group">
                    <label class="n-label strong" for="cacheCapacityGb">캐시 용량 (GB)</label>
                    <input id="cacheCapacityGb" type="number" min="0" max="1024" step="1"
                           th:field="*{cacheCapacityGb}"
                           class="n-input"
                           data-error-field="cacheCapacityGb"
                           th:classappend="${#fields.hasErrors('cacheCapacityGb')} ? 'is-invalid'">
                    <div class="n-hint">캐시가 없는 모델은 0 을 입력합니다.</div>
                    <div class="n-error" th:if="${#fields.hasErrors('cacheCapacityGb')}"
                         th:errors="*{cacheCapacityGb}"></div>
                </div>

                <div class="n-form-group">
                    <label class="n-label" for="pciSubsystemId">PCI Subsystem ID (선택)</label>
                    <input id="pciSubsystemId" type="text" th:field="*{pciSubsystemId}"
                           class="n-input"
                           data-error-field="pciSubsystemId"
                           th:classappend="${#fields.hasErrors('pciSubsystemId')} ? 'is-invalid'"
                           placeholder="예: 1458:0011">
                    <div class="n-hint">비워 두면 미확인으로 표시됩니다.</div>
                    <div class="n-error" th:if="${#fields.hasErrors('pciSubsystemId')}"
                         th:errors="*{pciSubsystemId}"></div>
                </div>

                <div class="n-form-group">
                    <label class="n-label" for="description">설명 (선택)</label>
                    <textarea id="description" th:field="*{description}"
                              class="n-textarea" rows="3"
                              data-error-field="description"
                              placeholder="예: SAS3008 계열, GIGABYTE 4종 보드 기본 장착"></textarea>
                </div>

                <div class="n-form-actions">
                    <a th:href="@{/management/raidcard}" class="n-btn n-btn-secondary">취소</a>
                    <button type="submit" class="n-btn n-btn-primary">등록</button>
                </div>
            </form>
        </div>
    </div>
</div>



<script th:src="@{/global/form-error.js}"></script>
<script th:src="@{/management/raidcard/raidcard-level-select.js}"></script>
<script th:src="@{/management/raidcard/raidcard-new.js}"></script>
</body>
</html>
