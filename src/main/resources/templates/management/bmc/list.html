<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: commonHead('BMC 펌웨어 관리')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/miller.css}">
    <link rel="stylesheet" th:href="@{/css/accordion.css}">
</head>
<body>
<nav th:replace="~{fragments/layout :: navbar('bmc')}"></nav>

<div class="n-page">
    <div class="n-page-header">
        <h1 class="n-page-title">BMC 펌웨어 관리</h1>
        <div class="n-header-actions">
            <!-- S5-4 — 토글 시 selectBoardId / selectId 등 다른 querystring 보존. -->
            <label class="n-checkbox">
                <input type="checkbox"
                       th:checked="${includeDeleted}"
                       data-include-deleted-toggle>
                삭제된 항목 포함
            </label>
            <!-- S5-5 — 외부 우상단 + 신규 BMC 등록. boardId 없는 진입점이라 폼에서 board 선택 단계. -->
            <a th:href="@{/management/bmc/new}"
               class="n-btn n-btn-primary">+ 신규 BMC 등록</a>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(boards)}" class="n-card">
        <div class="n-empty">
            <div class="n-empty-title">등록된 메인보드 모델이 없습니다.</div>
            <div class="n-empty-desc">
                BMC 펌웨어는 메인보드 모델에 귀속됩니다.
                <a th:href="@{/management/board}">메인보드 모델 관리</a> 페이지에서 모델을 먼저 등록하세요.
            </div>
        </div>
    </div>

    <div th:unless="${#lists.isEmpty(boards)}"
         class="n-miller"
         th:data-rank-enabled="${!includeDeleted}"
         th:data-rank-error="#{management.firmware.rank.save-failed}"
         data-board-aware="true"
         th:data-initial-select-id="${selectId}"
         th:data-initial-select-board-id="${selectBoardId}">

        <div class="n-miller-col n-miller-col-names">
            <div class="n-miller-col-header">메인보드 모델</div>
            <button th:each="board : ${boards}"
                    type="button"
                    class="n-miller-item n-miller-item-split"
                    th:classappend="${board.isDeleted} ? 'n-miller-item-disabled' : ''"
                    th:data-os-key="${board.id}">
                <span class="n-miller-version-label">
                    <span th:text="${board.modelName}">MS03-CE0-000</span>
                    <span class="n-note"
                          th:text="' · ' + ${board.vendorDisplayName}"> · Gigabyte</span>
                    <span class="n-note" th:if="${board.isDeleted}">(삭제됨)</span>
                </span>
            </button>
            <div class="n-miller-col-note">
                신규 메인보드 모델은
                <a th:href="@{/management/board}">메인보드 모델 관리</a>
                페이지에서 등록하세요.
            </div>
        </div>

        <div class="n-miller-col n-miller-col-versions">
            <div class="n-miller-col-header">BMC 버전</div>
            <!-- E2-1-a — 순서 SSOT 안내(BIOS 목록과 대칭). -->
            <div class="n-section-hint" id="fwRankHint" th:unless="${includeDeleted}"
                 th:text="#{management.firmware.rank.hint}">드래그하여 버전 순서 조정</div>
            <div th:each="board : ${boards}"
                 class="n-miller-version-panel"
                 th:data-os-key="${board.id}"
                 th:attr="data-rank-url=${board.isDeleted} ? null : @{/management/bmc/{b}/rank(b=${board.id})}">

                <div th:if="${#lists.isEmpty(board.bmcList)}"
                     class="n-miller-col-note">
                    등록된 BMC 펌웨어가 없습니다.
                </div>

                <button th:each="bmc : ${board.bmcList}"
                        type="button"
                        class="n-miller-item n-miller-item-split"
                        th:classappend="${bmc.isDeleted} ? 'n-miller-item-disabled' : ''"
                        th:data-os-id="${bmc.id}">
                    <span class="n-miller-version-label">
                        <span class="n-rank-handle" th:unless="${includeDeleted or bmc.isDeleted}"
                              title="끌어서 순서 변경" aria-label="끌어서 순서 변경">☰</span>
                        <span th:text="${bmc.version}">12.61</span>
                        <span th:if="${board.latestBmcId != null and bmc.id == board.latestBmcId}"
                              class="n-miller-latest" data-latest-mark>latest</span>
                        <span th:if="${bmc.isDeprecated and !bmc.isDeleted}"
                              class="n-deprecated-dot"
                              title="Deprecated"></span>
                        <span class="n-note" th:if="${bmc.isDeleted}">(삭제됨)</span>
                    </span>
                    <span th:unless="${bmc.isDeleted}"
                          class="n-miller-status-tag"
                          th:classappend="${bmc.isEnabled} ? 'n-miller-status-tag-on' : 'n-miller-status-tag-off'"
                          th:text="${bmc.isEnabled} ? '활성' : '비활성'">활성</span>
                </button>

                <div class="n-miller-col-foot" th:unless="${board.isDeleted}">
                    <a th:href="@{/management/bmc/{boardId}/new(boardId=${board.id})}"
                       class="n-btn n-btn-sm n-btn-secondary n-btn-block">+ BMC 등록</a>
                </div>
            </div>
        </div>

        <div class="n-miller-col n-miller-col-detail">
            <!-- S5-5 — C3 안내 텍스트 2 상태. -->
            <div class="n-miller-empty" id="millerEmpty"
                 data-empty-before="메인보드 모델을 선택하여 버전 보기"
                 data-empty-after="버전을 선택하여 상세 보기"
                 th:text="${selectBoardId != null or selectId != null} ? '버전을 선택하여 상세 보기' : '메인보드 모델을 선택하여 버전 보기'">메인보드
                모델을 선택하여 버전 보기
            </div>

            <th:block th:each="board : ${boards}">
                <div th:each="bmc : ${board.bmcList}"
                     class="n-miller-detail-panel"
                     th:data-os-id="${bmc.id}">

                    <dl class="n-accordion-fields">
                        <div class="n-accordion-field">
                            <dt>ID</dt>
                            <dd th:text="${bmc.id}"></dd>
                        </div>
                        <div class="n-accordion-field">
                            <dt>메인보드</dt>
                            <dd>
                                <span th:text="${board.vendorDisplayName + ' · ' + board.modelName}"></span>
                            </dd>
                        </div>
                        <div class="n-accordion-field">
                            <dt>이름</dt>
                            <dd>
                                <span th:text="${bmc.name}"></span>
                                <span th:if="${bmc.isDeprecated}"
                                      class="n-badge n-badge-yellow n-meta"
                                     >Deprecated</span>
                            </dd>
                        </div>
                        <div class="n-accordion-field">
                            <dt>버전</dt>
                            <dd><code th:text="${bmc.version}"></code></dd>
                        </div>
                        <div class="n-accordion-field">
                            <dt>트리 루트</dt>
                            <dd><code th:text="${bmc.treeRootPath}"></code></dd>
                        </div>
                        <!-- R12-2 — 실행 대상(진입점) 표기는 화면에서 제거 (구조는 유지 — 단일 펌웨어 파일 모델에서 표시 가치가 없다). -->
                        <div class="n-accordion-field">
                            <dt>manifest 해시</dt>
                            <dd class="n-small"><code th:text="${bmc.manifestHash}"></code></dd>
                        </div>
                        <div class="n-accordion-field">
                            <dt>무결성</dt>
                            <dd>
                                <span class="n-badge"
                                      th:classappend="${T(com.example.serverprovision.management.common.view.IntegrityStatusView).badgeClass(bmc.integrityStatus)}"
                                      th:data-bmc-id="${bmc.id}"
                                      th:data-verify-url="@{/management/bmc/{boardId}/bmc/{bmcId}/verify(boardId=${board.id},bmcId=${bmc.id})}"
                                      th:data-status-url="@{/management/bmc/{boardId}/bmc/{bmcId}/integrity-status(boardId=${board.id},bmcId=${bmc.id})}"
                                      th:text="${bmc.integrityStatus != null ? bmc.integrityStatus.name() : 'NOT_VERIFIED'}">NOT_VERIFIED</span>
                                <button type="button" class="n-btn n-btn-sm n-btn-outline"
                                        th:data-verify-url="@{/management/bmc/{boardId}/bmc/{bmcId}/verify(boardId=${board.id},bmcId=${bmc.id})}">
                                    검증
                                </button>
                            </dd>
                        </div>
                        <div class="n-accordion-field">
                            <dt>설명</dt>
                            <dd th:text="${bmc.description != null and !#strings.isEmpty(bmc.description)} ? ${bmc.description} : '—'"></dd>
                        </div>
                        <div class="n-accordion-field">
                            <dt>상태</dt>
                            <dd>
                                    <div th:replace="~{fragments/ui/lifecycle-actions :: statusActions(deleted=${bmc.isDeleted}, enabled=${bmc.isEnabled}, toggleUrl=@{/management/bmc/{boardId}/bmc/{bmcId}/toggle(boardId=${board.id},bmcId=${bmc.id})}, blockEnable=${bmc.parentBlocksEnable}, blockTip='부모 메인보드가 비활성 / 삭제 상태입니다. 부모를 먼저 정상화해주세요.', toggleTitle=null, selectKey=null, includeDeleted=null)}"></div>
                                </dd>
                        </div>
                        <!--/* 사용 중단 권고는 활성 여부와 다른 축이다(Deprecated ≠ 비활성).
                               조작을 액션 줄에 두면 무엇이 바뀌는지 화면에서 보이지 않아 상태 옆으로 옮겼다. */-->
                        <div class="n-accordion-field" th:unless="${bmc.isDeleted}">
                            <dt>사용 중단 권고</dt>
                            <dd>
                                <div th:replace="~{fragments/ui/lifecycle-actions :: deprecateActions(deprecated=${bmc.isDeprecated}, deprecateUrl=@{/management/bmc/{boardId}/bmc/{bmcId}/deprecate(boardId=${board.id},bmcId=${bmc.id})}, undeprecateUrl=@{/management/bmc/{boardId}/bmc/{bmcId}/undeprecate(boardId=${board.id},bmcId=${bmc.id})}, deprecateConfirm=true, label=|BMC '${bmc.name}'|, extra=null, blockUndeprecate=${bmc.parentBlocksUndeprecate}, blockTip='부모 메인보드가 Deprecated / 삭제 상태입니다. 부모를 먼저 해제 / 복구해주세요.', undeprecateConfirm=true, resourceType='BMC_FIRMWARE', resourceId=${bmc.id}, selectKey=null, includeDeleted=null, badgeOn='Deprecated', btnOn='Deprecated 표시', btnOff='Deprecated 해제')}"></div>
                            </dd>
                        </div>
                    </dl>

                    <div class="n-form-actions">
                        <th:block th:unless="${bmc.isDeleted}">
                            <a th:href="@{/management/bmc/{boardId}/bmc/{bmcId}/edit(boardId=${board.id},bmcId=${bmc.id})}"
                               class="n-btn n-btn-secondary">수정</a>
                            <form th:action="@{/management/bmc/{boardId}/bmc/{bmcId}/delete(boardId=${board.id},bmcId=${bmc.id})}"
                                  method="post"
                                  class="mk3-2-delete-form"
                                  data-confirm-soft-delete=""
                                  th:data-resource-label="|BMC '${bmc.name}'|">
                                <button type="submit" class="n-btn n-btn-outline-danger">삭제</button>
                            </form>
                        </th:block>
                        <th:block th:if="${bmc.isDeleted}">
                            <!-- R2-2 — 부모 메인보드가 삭제면 restore 차단 -->
                            <span th:if="${bmc.parentBlocksRestore}" class="n-btn-tooltip-wrap"
                                  data-tooltip="부모 메인보드가 삭제 상태입니다. 부모부터 복구해주세요.">
                                <button type="button" class="n-btn n-btn-outline-info" disabled>복구</button>
                            </span>
                            <form th:unless="${bmc.parentBlocksRestore}"
                                  th:action="@{/management/bmc/{boardId}/bmc/{bmcId}/restore(boardId=${board.id},bmcId=${bmc.id})}"
                                  method="post"
                                  data-confirm-restore=""
                                  th:data-resource-label="|BMC '${bmc.name}'|">
                                <button type="submit" class="n-btn n-btn-outline-info">복구</button>
                            </form>
                            <!-- S5-6-1 — typed-name expected 는 BE 가 modal trigger 시 응답. -->
                            <form th:action="@{/management/bmc/{boardId}/bmc/{bmcId}/purge(boardId=${board.id},bmcId=${bmc.id})}"
                                  method="post"
                                  data-confirm-purge=""
                                  data-resource-type="BMC_FIRMWARE"
                                  th:data-resource-id="${bmc.id}"
                                  th:data-resource-label="|BMC '${bmc.name}'|"
                                  data-resource-extra="디스크의 펌웨어 파일도 함께 제거됩니다.">
                                <button type="submit" class="n-btn n-btn-danger">영구 삭제</button>
                            </form>
                        </th:block>
                    </div>
                </div>
            </th:block>
        </div>
    </div>
</div>

<!-- MK3-2 — softDelete reject modal fragment. -->
<div th:replace="~{fragments/management/delete-reject-modal :: deleteRejectModal('deleteReject')}"></div>

<!-- S5-2 — 4 종 자원 상태 변경 modal 묶음 + 공통 script 통합. -->
<!-- S5-6-1 — confirm-purge 만 lazy-load. -->
<div th:replace="~{fragments/management/confirm-modals :: lazyShell}"></div>

<!-- S5-4 — '삭제된 항목 포함' 토글 시 selectBoardId / selectId 등 querystring 보존. -->
<script th:src="@{/global/include-deleted-toggle.js}"></script>
<script th:src="@{/management/os/os-list.js}"></script>
<script th:src="@{/management/bios/bios-list.js}"></script>
<script th:src="@{/global/row-drag.js}"></script>
<script th:src="@{/management/common/firmware-rank.js}"></script>
<script th:src="@{/management/common/delete-reject-modal.js}"></script>
</body>
</html>
