<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--
  쪽 이동 줄 조각 (S8-1 · S8-4 개편)
  ─────────────────────────────────────────────────────────
  표가 든 판의 **위**에 붙는 한 줄(S8-4 — ecount 방식). 왼쪽은 « · 쪽 번호(10 개씩 한 묶음) · » · 쪽 번호 입력 / 전체,
  오른쪽은 표시 개수. 판이 화면 밖으로 밀려도 이 줄과 표 머리는 화면 위에 붙어 있는다(sticky, style.css §16).
  이동 링크는 컨트롤러 인자 ListLinks 가 만든다(page 만 바꾸고 나머지 상태는 그대로). 갈 수 없는 방향의 « · » 는
  자리만 지키고 보이지 않는다 — 첫 쪽과 다른 쪽에서 번호가 옆으로 밀리지 않게.

  쪽 번호 입력은 폼 필드가 아니다(page 는 폼 필드가 아니라는 S8-1 규칙). Enter 를 받으면 list-query.js ⑫ 가
  data-page-base(첫 쪽 주소)에 page 만 바꿔 이동한다. 범위 밖 값은 1 · 전체 쪽 수로 맞춘다.

  표시 개수 셀렉트는 조회 띠 폼(id="listQuery") 소속이다 — HTML form 속성으로 폼 밖에 서 있어도 그 폼의
  필드가 되므로, 바꾸면 폼이 제출되고 page 는 폼 필드가 아니라 사라져 첫 쪽이 된다. data-default 는
  Paging.DEFAULT_SIZE 와 같은 값이며 list-query.js 가 기본값을 URL 에서 뺄 때 본다.

  사용(판 안, 표 위):
    <div th:replace="~{fragments/ui/pagination :: pager(${page}, ${links})}"></div>
      page  : org.springframework.data.domain.Page
      links : global.web.list.ListLinks
-->
<body>
<div th:fragment="pager(page, links)" class="n-pagination"
     th:with="total=${page.totalPages > 0 ? page.totalPages : 1},
              blockStart=${(page.number / 10) * 10},
              blockEnd=${(page.number / 10) * 10 + 9 < total ? (page.number / 10) * 10 + 9 : total - 1}">
    <nav class="n-pagination-nav" aria-label="쪽 이동">
        <a th:if="${page.hasPrevious()}" class="n-page-arrow" th:href="${links.page(page.number - 1)}"
           aria-label="이전 쪽">&laquo;</a>
        <span th:unless="${page.hasPrevious()}" class="n-page-arrow n-page-arrow-hidden" aria-hidden="true">&laquo;</span>
        <th:block th:each="i : ${#numbers.sequence(blockStart, blockEnd)}">
            <span th:if="${i == page.number}" class="n-page-num n-page-current" aria-current="page" th:text="${i + 1}">1</span>
            <a th:unless="${i == page.number}" class="n-page-num" th:href="${links.page(i)}" th:text="${i + 1}">2</a>
        </th:block>
        <a th:if="${page.hasNext()}" class="n-page-arrow" th:href="${links.page(page.number + 1)}"
           aria-label="다음 쪽">&raquo;</a>
        <span th:unless="${page.hasNext()}" class="n-page-arrow n-page-arrow-hidden" aria-hidden="true">&raquo;</span>
        <span class="n-page-jump">
            <input type="number" class="n-input" min="1" th:max="${total}" inputmode="numeric"
                   data-page-jump th:attr="data-page-base=${links.page(0)},data-page-total=${total}"
                   aria-label="이동할 쪽 번호">
            <span>/ <span th:text="${total}">1</span></span>
        </span>
    </nav>
    <label class="n-pagination-size">표시 개수
        <select name="size" form="listQuery" class="n-select" data-default="20" aria-label="표시 개수">
            <option value="20" th:selected="${page.size == 20}">20</option>
            <option value="50" th:selected="${page.size == 50}">50</option>
            <option value="100" th:selected="${page.size == 100}">100</option>
        </select>
    </label>
</div>
</body>
</html>
