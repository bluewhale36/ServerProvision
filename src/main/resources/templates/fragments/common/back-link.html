<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--
  상세 화면의 '목록으로'
  ─────────────────────────────────────────────────────────
  href 는 <b>그 화면의 기본 목록</b>이다. 실제로 어디로 돌아갈지는 화면 이력 스택이 정하며
  (global/nav-stack.js), 스택이 비었거나 이 화면의 것이 아니면 이 href 가 그대로 열린다 —
  주소창 직접 진입 · 새로고침 · 스크립트 미적재에서 자연스럽게 성립한다.

  자리는 우측 상단으로 고정한다 — 서버 상세는 제목 위, 그룹 상세는 우측이라
  화면을 오갈 때 눈이 매번 다시 찾아야 했다.

  사용:
    <div th:replace="~{fragments/common/back-link :: backLink('/provisioning/server')}"></div>
-->
<head><title>back-link fragment</title></head>
<body>

<div th:fragment="backLink(defaultHref)" class="n-header-actions">
    <a class="n-back-link" data-nav-back th:href="@{__${defaultHref}__}">← 목록으로</a>
</div>

</body>
</html>
