<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  세팅 정의서 할당 선택지 <option> 목록 (U3-2-b DEC-G).
  ─────────────────────────────────────────────────────────
  사용 컨텍스트 : provisioning/server-detail 의 할당 폼 · 재할당 폼 두 select 가 함께 쓴다.
                 두 곳이 같은 라벨 규칙을 갖도록 fragment 로 한 벌만 둔다.
  파라미터      : options — List<SettingSummaryResponse> (컨트롤러의 definitionOptions)
  선택지 구성   : 삭제·비활성 정의서는 애초에 목록에 없다 — 서버 가드와 같은 판정
                 (SettingDefinition.assignBlockReason) 을 조회 서비스가 적용해 걸러낸다.
                 사용 중단 권고(deprecated) 정의서는 할당이 가능하므로 남기되, 라벨에 권고를 덧붙여
                 선택 전에 알 수 있게 한다.
-->
<th:block th:fragment="definitionOptions(options)">
    <option th:each="def : ${options}"
            th:value="${def.id}"
            th:text="${def.deprecated} ? |${def.name} (사용 중단 권고)| : ${def.name}">web-standard</option>
</th:block>
</body>
</html>
