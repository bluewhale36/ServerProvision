<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  세팅 정의서 할당 선택지 <option> 목록 (U3-2-b DEC-G · U3-5-a).
  ─────────────────────────────────────────────────────────
  사용 컨텍스트 : provisioning/server-detail 의 할당 폼 · 재할당 폼 두 select 가 함께 쓴다.
                 두 곳이 같은 라벨 규칙을 갖도록 fragment 로 한 벌만 둔다.
  파라미터      : options — List<DefinitionOptionResponse> (컨트롤러의 assignmentForm.options)

  선택지 구성 (두 층으로 갈린다)
    · 삭제·비활성 정의서는 애초에 목록에 없다 — 정의서 자신의 lifecycle 은 어느 서버에 붙이든
      결과가 같으므로 서버 가드와 같은 판정(SettingDefinition.assignBlockReason)으로 걸러낸다.
    · 하드웨어가 맞지 않는 정의서는 목록에 남기고 disabled 로 잠근다 — 서버마다 결과가 다르므로
      사라지면 운영자가 "없어진 것인지 내 서버에 안 맞는 것인지" 를 구분할 수 없다(U3-5-a DEC-D).
      잠긴 이유는 라벨에 그대로 적는다. 그 문구는 AssignmentBlockKind.evaluate 가 만든 것이며
      direct POST 를 거절하는 서버 가드의 메시지와 같은 문자열이다.
    · 사용 중단 권고(deprecated)는 차단이 아니므로 선택 가능하되 라벨에 권고를 덧붙인다.
    · 보드를 요구하는데 서버 하드웨어가 아직 수집 전이면 막지 않고 표식만 단다 — 조용히 통과시키는
      것과 구분하기 위해서다.
-->
<th:block th:fragment="definitionOptions(options)">
    <option th:each="option : ${options}"
            th:value="${option.id}"
            th:disabled="${option.blocked}"
            th:title="${option.blockReason}"
            th:text="${option.name}
                     + (${option.deprecated} ? ' (사용 중단 권고)' : '')
                     + (${option.blocked} ? ' — ' + ${option.blockReason} : '')
                     + (${option.unverified} ? ' (하드웨어 수집 전 — 대조하지 못했습니다)' : '')">web-standard</option>
</th:block>
</body>
</html>
