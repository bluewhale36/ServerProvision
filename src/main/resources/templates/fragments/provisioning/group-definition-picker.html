<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  그룹 일괄 할당 모달의 내용 — 검색 줄 + 표 + 고른 정의서의 적용 미리보기 · 내용 (U3-5-c → R20)
  ─────────────────────────────────────────────────────────
  사용 컨텍스트 : 그룹 상세(provisioning/server-group-detail) 의 정의서 일괄 할당 모달(골라 할당 · 표준 지정 두 모드).
  파라미터      : picker — GroupPickerResponse · pickerQuery — DefinitionPickerQuery(기간은 기본 범위로 채운 값)
                 rangeDefaultFrom · rangeDefaultTo · rangeToday — ListDateRangeDefaults
  적재 경로     : GET /provisioning/server-group/{id}/assignment/picker?q=&from=&to= — 단건 모달과 같은 검색 규칙 · 같은 갈아끼우기.

  U3-5-b 의 단건 모달과 무엇이 다른가 (DEC-A)
    그룹은 멤버마다 결과가 갈리므로 펼침 영역이 멤버별 미리보기 표를 갖는다. 부분 적용(4 대 중 3 대)을 단건의 blockReason
    자리에 담으면 blocked() 가 참이 되어 이름이 거짓말을 한다. 단계 카드 조각(setting-process-cards)은 그대로 재사용한다.
  펼침의 순서가 '미리보기 → 정의서 내용' 인 이유 — 그룹 문맥에서 고르는 이유는 "이 그룹에 어떻게 적용되나" 이다.

  행이 JS 에 넘기는 것 (data-*)
    · data-definition-id   : 선택 시 hidden input 에 실릴 값 · 펼침 패널(data-picker-panel)과 짝
    · data-definition-name : 하단 상태줄에 적을 이름
    · data-assign-count    : 붙는 멤버 수 — 골라 할당 모드에서 0 이면 확정이 열리지 않는다
    · data-summary         : 하단 상태줄에 그대로 싣는 한 줄 요약(서버가 만든 문구)
-->
<div class="n-picker-search" th:fragment="picker" data-picker-root>
    <!--/* 검색칸 + 조회 조건 창 — 두 모달 공용(R20). 목록 화면의 조회 띠와 같은 모양 */-->
    <th:block th:replace="~{fragments/provisioning/definition-picker-filter :: band}"></th:block>
    <div th:replace="~{:: results}"></div>
</div>

<div class="n-picker-results" th:fragment="results" data-picker-results>
    <div class="n-lookup-results n-picker-table-wrap">
        <table class="n-table n-lookup-table n-picker-table">
            <thead>
            <!--/* 분모(그룹 멤버 수)는 열 머리에서 한 번만 알린다 — 행마다 되풀이하면 같은 값이 목록 길이만큼 반복된다(OQ-2). */-->
            <tr><th>정의서</th><th>대상 보드</th><th>단계 구성</th>
                <th class="center" th:text="|적용 대상 (멤버 ${picker.memberCount} 대)|">적용 대상</th></tr>
            </thead>
            <tbody>
            <tr th:each="item : ${picker.items}" data-picker-row tabindex="0"
                th:classappend="${item.blocked} ? 'n-lookup-row-disabled'"
                th:attr="data-definition-id=${item.id},data-definition-name=${item.name},data-assign-count=${item.willAssignCount},data-summary=${item.preview.summary()}">
                <td>
                    <button type="button" class="n-lookup-pick" tabindex="-1" th:text="${item.name}">web-standard</button>
                    <span th:if="${item.deprecated}" class="n-badge n-badge-yellow">사용 중단</span>
                </td>
                <td th:text="${item.preview.definition.requiredBoardModelName} ?: '보드 무관'">MS74-HB0</td>
                <td th:text="${#strings.listJoin(item.preview.definition.processTypes.![displayName], ' · ')}">펌웨어 업데이트 · BIOS 설정</td>
                <td class="center"><span class="n-badge n-picker-count" th:classappend="${item.blocked} ? 'n-badge-red' : 'n-badge-green'"
                                         th:text="${item.willAssignCount} + ' 대'">3 대</span></td>
            </tr>
            <tr th:if="${picker.items.isEmpty()}">
                <td colspan="4" class="n-lookup-empty"
                    th:text="${picker.totalCount == 0} ? '할당할 수 있는 세팅 정의서가 없습니다.' : #{common.lookup.empty}">검색 결과가 없습니다.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="n-picker-detail" data-picker-detail>
        <p class="n-detail-empty" data-picker-detail-empty>표에서 정의서를 고르면 이 그룹에 어떻게 적용되는지와 정의서 내용이 펼쳐집니다.</p>
        <div th:each="item : ${picker.items}" class="n-picker-detail-panel" hidden
             th:attr="data-picker-panel=${item.id}">
            <div class="n-picker-detail-title">고른 정의서 · <b th:text="${item.name}">web-standard</b></div>

            <div th:class="${item.blocked} ? 'n-alert n-alert-danger n-picker-apply-summary' : 'n-alert n-alert-success n-picker-apply-summary'" role="alert">
                <b th:text="${item.preview.summary()}">4 대 중 3 대에 할당됩니다.</b>
            </div>
            <div th:if="${item.deprecated}" class="n-alert n-alert-warning" role="alert">
                <b>사용 중단이 권고된 정의서입니다.</b>
                <div class="n-section-hint n-block-gap-sm">
                    할당은 가능하지만 대체할 정의서가 있는지 확인해 주세요.
                </div>
            </div>

            <!--/* 멤버별 분류 — 확정하기 전에 무엇이 일어날지 이 표가 전부 말한다.
                   사유는 도메인이 만든 문구 그대로라 direct POST 를 거절하는 서버 가드와 같은 말이다. */-->
            <div class="n-label strong n-block-gap-sm">멤버별 적용</div>
            <table class="n-table">
                <thead>
                <tr>
                    <th>서버</th>
                    <th>보드 모델</th>
                    <th>결과</th>
                    <th>사유</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="member : ${item.preview.members()}">
                    <td th:text="${member.serverName != null} ? ${member.serverName} : '(이름 미지정)'">srv-01</td>
                    <td th:text="${member.server.boardModelName != null} ? ${member.server.boardModelName} : '수집 전'">
                        MS03-CE0</td>
                    <td>
                        <span class="n-badge" th:classappend="${member.outcome.badgeClass}"
                              th:text="${member.outcome.displayName}">할당됨</span>
                    </td>
                    <td>
                        <span th:if="${member.reason != null}" class="n-muted n-small"
                              th:text="${member.reason}">사유</span>
                        <span th:unless="${member.reason != null}" class="n-muted">—</span>
                    </td>
                </tr>
                </tbody>
            </table>

            <div class="n-label strong">정의서 내용</div>
            <!--/* 카드 렌더는 정의서 상세 화면(U2) · 단건 모달(U3-5-b)과 같은 한 벌이다(DEC-A). */-->
            <th:block th:replace="~{fragments/provisioning/setting-process-cards :: processCards(${item.detail})}"></th:block>
        </div>
    </div>
</div>
</body>
</html>
