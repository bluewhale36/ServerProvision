<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--
  서버 넣기 모달의 후보 목록 조각 (U3-4 개정)
  ─────────────────────────────────────────────────────────
  Model:
    candidates : GuestServerListResponse — 무소속 서버를 시간 × 스펙으로 묶은 것

  서버 목록과 <b>같은 방식</b>으로 묶는 이유는, 고르는 자리가 다른 순서로 늘어놓으면
  방금 목록에서 본 묶음을 여기서 다시 찾아야 하기 때문이다. 같은 조립을 그대로 쓰면
  "그 4대" 를 눈으로 확인하고 한 번에 고를 수 있다.

  행 구성이 서버 목록과 다른 것은 <b>고르는 화면</b>이기 때문이다 — 선택 칸이 앞에 오고,
  이동 링크 · 그룹 배지(전부 무소속이라 의미 없음) · 연결처럼 고를 때 쓰이지 않는 열은 뺐다.
-->
<head><title>server-picker fragment</title></head>
<body>

<div th:fragment="candidates">

    <div th:if="${candidates.empty}" class="n-empty">
        <div class="n-empty-title">넣을 수 있는 서버가 없습니다.</div>
        <div class="n-empty-desc">
            모든 서버가 이미 어느 그룹엔가 속해 있습니다. 다른 그룹의 서버를 옮기려면
            그 그룹 상세에서 먼저 뺀 뒤 여기서 넣어주세요.
        </div>
    </div>

    <!--/* 스펙이 아직 없는 서버 — 묶을 근거가 없어 한 덩이로 둔다. 그룹에 넣는 것 자체는 막지 않는다. */-->
    <section th:if="${candidates.pending != null}" class="n-card n-glist">
        <div class="n-glist-head">
            <strong class="n-glist-title">등록 진행 중</strong>
            <span class="n-glist-hint">스펙이 아직 없어 구성으로 묶이지 않습니다</span>
            <span class="n-badge n-badge-gray" th:text="${candidates.pending.total()} + '대'">1대</span>
        </div>
        <div class="n-glist-panel">
            <table class="n-table n-table-picker">
                <thead th:replace="~{fragments/provisioning/server-picker :: pickerHead}"></thead>
                <tbody>
                <th:block th:each="s : ${candidates.pending.registeredOnly}">
                    <tr th:replace="~{fragments/provisioning/server-picker :: pickerRow(${s})}"></tr>
                </th:block>
                <th:block th:each="s : ${candidates.pending.collecting}">
                    <tr th:replace="~{fragments/provisioning/server-picker :: pickerRow(${s})}"></tr>
                </th:block>
                </tbody>
            </table>
        </div>
    </section>

    <section th:each="tg : ${candidates.timeGroups}" class="n-card n-glist">
        <div class="n-glist-head">
            <strong class="n-glist-title" th:text="${tg.bucket.description}">방금</strong>
            <span class="n-glist-hint">이 시간대에 묶인 서버 <b th:text="${tg.serverCount()}">3</b>대</span>
        </div>
        <div class="n-accordion">
            <details class="n-accordion-item" th:each="sg, st : ${tg.specGroups}" open>
                <summary class="n-accordion-head">
                    <span class="n-accordion-chevron"></span>
                    <span class="n-accordion-title"><strong th:text="'스펙 ' + ${st.count}">스펙 1</strong>
                        <span class="n-glist-label" th:text="${sg.label}">MS03-CE0 · Xeon Gold 6338 ×2</span></span>
                    <span class="n-badge n-badge-blue n-accordion-badge"
                          th:text="${sg.servers.size()} + '대'">2대</span>
                </summary>
                <div class="n-accordion-body">
                    <table class="n-table n-table-picker">
                        <thead th:replace="~{fragments/provisioning/server-picker :: pickerHead}"></thead>
                        <tbody>
                        <th:block th:each="s : ${sg.servers}">
                            <tr th:replace="~{fragments/provisioning/server-picker :: pickerRow(${s})}"></tr>
                        </th:block>
                        </tbody>
                    </table>
                </div>
            </details>
        </div>
    </section>
</div>

<thead th:fragment="pickerHead">
<tr>
    <th class="n-th-center">선택</th>
    <th>이름</th>
    <th>SMBIOS UUID</th>
    <th>보드 모델</th>
    <th>운영 상태</th>
    <th>등록 시각</th>
</tr>
</thead>

<table><tbody>
<tr th:fragment="pickerRow(s)" class="n-row-hover">
    <td class="n-th-center">
        <input type="checkbox" name="serverIds" th:value="${s.id}" data-picker-check>
    </td>
    <td th:text="${s.name != null} ? ${s.name} : '(이름 미지정)'">srv-01</td>
    <td><code class="n-mono" th:text="${s.systemUuid}">uuid</code></td>
    <td th:text="${s.boardModelName != null} ? ${s.boardModelName} : '—'">MS03-CE0</td>
    <!--/* 회수된 서버도 넣을 수 있지만(DEC-H) 고르기 전에 알아야 한다 */-->
    <td>
        <span th:if="${s.status != null}" class="n-badge"
              th:classappend="${s.status.name() == 'DECOMMISSIONED'} ? ' n-badge-gray' : ' n-badge-blue'"
              th:text="${s.status.description}">등록됨</span>
        <span th:unless="${s.status != null}" class="n-muted">—</span>
    </td>
    <td th:text="${#temporals.format(s.createdAt, 'yyyy-MM-dd HH:mm')}">2026-08-11 16:00</td>
</tr>
</tbody></table>

</body>
</html>
