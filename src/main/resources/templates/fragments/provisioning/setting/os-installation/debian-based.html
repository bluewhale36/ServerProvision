<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  Debian 계열 (Ubuntu) OS 설치 폼 전용 입력 블록.
  ─────────────────────────────────────────────────────────
  사용 컨텍스트 : provisioning/setting-new 의 OS_INSTALLATION 카드 리눅스 블록(oiLinuxBlock).
                 R11 에서 폼에서 빠졌다가 HF33 에서 다시 붙였다.
  Ubuntu 는 Kickstart 대신 Subiquity autoinstall YAML 을 쓰므로 RHEL 의
  환경/패키지그룹 개념이 없고, identity.hostname 과 packages 목록으로 매핑된다.
  data-os-family="DEBIAN_BASED" — setting-form.js 가 선택 OS 계열에 맞춰 표시를 토글한다.
-->
<section th:fragment="form" class="n-os-family-pane" data-os-family="DEBIAN_BASED" hidden>
    <div class="n-pane-title">Debian 계열 전용 설정</div>

    <!-- 호스트명 (autoinstall identity.hostname) — UbuntuInstallationRequest 필수 값. 형식 검증은 서버 @Valid 가 SSOT 다. -->
    <div class="n-form-group" data-error-field="hostname">
        <label class="n-label strong" for="oiHostname">호스트명</label>
        <input type="text" id="oiHostname" class="n-input" maxlength="253"
               placeholder="예: ubuntu-node-01">
        <div class="n-hint">소문자, 숫자, 하이픈, 마침표만 쓸 수 있습니다.</div>
    </div>

    <!-- APT 패키지 목록 (autoinstall packages) -->
    <div class="n-form-group" data-error-field="packages">
        <label class="n-label strong" for="oiPackages">추가 설치 패키지</label>
        <input type="text" id="oiPackages" class="n-input"
               placeholder="예: vim, curl">
        <div class="n-hint">콤마로 구분해 입력합니다. 비워 두면 기본 패키지만 설치합니다.</div>
    </div>
</section>
</body>
</html>
