<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!--/*
  MK3-2 — softDelete reject modal fragment.
  ─────────────────────────────────────────────────────────
  사전조건 (Files.exists(DB.path)) 위반으로 409 + DeleteRejectResponse 응답 시
  본 modal 이 표시된다. 사용자 3택 — 위치 정정 후 삭제 (default · 권장) / 강제 정리 / 취소.

  파라미터:
    - prefix : modal element id 접두사 (페이지에 여러 modal 이 있을 때 충돌 회피).

  JS 흐름은 `delete-reject-modal.js` 가 처리. 기존 페이지의 삭제 form submit 을 가로채
  XHR 호출 → 409 응답이면 본 modal 표시 → 사용자 액션 → delete-intent endpoint 호출.

  생성되는 element id (prefix="deleteReject" 기준):
    deleteRejectModal · deleteRejectBackdrop · deleteRejectMissingPath ·
    deleteRejectGhostBadge · deleteRejectCorrectBtn · deleteRejectForcedBtn ·
    deleteRejectCancelBtn · deleteRejectCloseBtn · deleteRejectError

  CSS: 기존 .n-alert / .n-btn / .n-card 재사용. 신규 CSS 토큰 0.
*/-->
<div class="cm-overlay" th:fragment="deleteRejectModal(prefix)"
     th:id="${prefix} + 'Modal'"
     hidden>

    <!-- backdrop -->
    <div class="cm-backdrop" th:id="${prefix} + 'Backdrop'"></div>

    <!-- card -->
    <div class="n-card cm-card cm-card-md" role="dialog" aria-modal="true">
        <div class="n-card-body">
            <h2 class="cm-title cm-title-split">
                <span>파일을 찾을 수 없습니다</span>
                <button type="button" th:id="${prefix} + 'CloseBtn'"
                        class="n-btn n-btn-sm n-btn-outline" aria-label="닫기">×
                </button>
            </h2>

            <div class="n-alert n-alert-warning">
                추적 중인 위치에 파일이 없습니다. 처리 방법을 골라야 합니다.
            </div>

            <div class="cm-block">
                <span class="cm-note">추적 위치:</span>
                <code class="cm-path" th:id="${prefix} + 'MissingPath'"></code>
            </div>

            <div class="cm-block" th:id="${prefix} + 'GhostBadge'" hidden>
                <span class="n-badge cm-ghost-badge">
                    유령 DB 기록
                </span>
                <span class="cm-note n-meta">
                    파일이 추적 위치와 휴지통 어디에도 없습니다.
                </span>
            </div>

            <div class="cm-option-list">
                <button type="button" th:id="${prefix} + 'CorrectBtn'"
                        class="n-btn n-btn-primary cm-option">
                    <strong>위치 정정 후 삭제</strong> (권장)
                    <div class="cm-option-desc">
                        파일을 옮긴 경우에 고릅니다. 새 위치를 찾아 정정한 뒤 삭제합니다.
                    </div>
                </button>

                <button type="button" th:id="${prefix} + 'ForcedBtn'"
                        class="n-btn n-btn-outline-danger cm-option">
                    <strong>강제 정리</strong>
                    <div class="cm-option-desc">
                        파일이 사라진 경우에 고릅니다. 시스템 등록만 정리하고 디스크는 바꾸지 않습니다.
                    </div>
                </button>

                <button type="button" th:id="${prefix} + 'CancelBtn'"
                        class="n-btn n-btn-secondary">취소
                </button>
            </div>

            <div th:id="${prefix} + 'Error'" hidden
                 class="n-alert n-alert-danger n-block-gap"></div>
        </div>
    </div>
</div>
</body>
</html>
