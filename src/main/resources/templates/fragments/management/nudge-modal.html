<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!--/*
  MK2 — 중복 확인 창 조각. 처리는 global/nudge-modal.js 의 NudgeModal.open 한 곳(HF30-3).
  ─────────────────────────────────────────────────────────
  업로드 전(intent) 또는 업로드 뒤(해시) 서버가 409 + NudgeRequiredResponse 를 회신하면
  본 창이 표시된다. 후보는 휴지통 자원뿐이다(HF30-2).

  파라미터:
    - prefix : modal element id 접두사. 페이지에 여러 modal 이 있을 때 충돌 회피
               ("nudge" / "biosNudge" 등). JS 가 prefix + suffix 로 element 잡음.
    - confirmBaseUrl : `/management/{domain}/nudge` — 3 endpoint prefix.
                       JS 가 `confirmBaseUrl + '/{nudgeId}/proceed'` 로 호출.

  생성되는 element id (prefix="nudge" 기준):
    nudgeModal · nudgeBackdrop · nudgeWarning · nudgeConflictsList · nudgeTypedNameWrap · nudgeTypedName ·
    nudgeTypedNameExpected · nudgeReplaceNote · nudgeError · nudgeProceedBtn · nudgeReplaceBtn · nudgeCancelBtn

  CSS: 기존 .n-alert / .n-btn / .n-card 재사용. 신규 CSS 토큰 0.
*/-->
<div class="cm-overlay" th:fragment="nudgeModal(prefix, confirmBaseUrl)"
     th:id="${prefix} + 'Modal'"
     hidden
     th:data-confirm-base-url="${confirmBaseUrl}">

    <!-- backdrop -->
    <div class="cm-backdrop" th:id="${prefix} + 'Backdrop'"></div>

    <!-- card -->
    <div class="n-card cm-card cm-card-md" role="dialog" aria-modal="true">
        <div class="n-card-body">
            <h2 class="cm-title cm-title-split">
                <span>중복 확인</span>
                <!-- MK2 — TTL countdown. JS (NudgeTimer) 가 expiresAt 으로부터 mm:ss 갱신.
                     0:00 도달 시 modal 자동 닫힘 + onExpire 호출. -->
                <span class="cm-title-meta" data-nudge-timer
                     
                      title="이 시간 안에 정하지 않으면 중복 확인이 만료됩니다."></span>
            </h2>
            <div class="n-alert n-alert-warning" th:id="${prefix} + 'Warning'">
                같은 자원이 휴지통에 있습니다.
            </div>

            <ul class="cm-conflict-list" th:id="${prefix} + 'ConflictsList'">
                <!-- JS 가 NudgeConflictEntry 로 채움 -->
            </ul>

            <div class="n-hint n-lead">
                <strong>그래도 등록</strong>: 새 자원으로 등록(기존 자원 보존)<br>
                <span th:id="${prefix} + 'ReplaceNote'"><strong>기존 영구 삭제 후 등록</strong>: 기존 자원을 영구 삭제하고 새 자원 등록<br></span>
                <strong>취소</strong>: <span data-cancel-note="beforeUpload">등록 취소</span><span data-cancel-note="afterUpload" hidden>등록 취소, 올린 파일 정리</span><span data-cancel-note="existingFolder" hidden>등록 취소, 기존 폴더 보존</span>
            </div>

            <!--
              자원명 입력(HF30-3 D12). 후보를 고르면 JS 가 그 자원의 displayName 을 보이고, 같은 문자열을
              입력해야 [기존 영구 삭제 후 등록] 이 활성화된다(휴지통 영구 삭제와 같은 확인). 서버도 같은 값으로 대조한다.
            -->
            <div class="cm-typed-block" th:id="${prefix} + 'TypedNameWrap'"
                 hidden>
                <label class="cm-typed-target-label" th:for="${prefix} + 'TypedName'">
                    영구 삭제를 확정하려면 아래 자원명을 정확히 입력해야 합니다.
                </label>
                <p class="n-hint n-hint-warn">기존 자원을 먼저 영구 삭제하고 새 자원을 등록합니다. 등록이 실패해도 영구 삭제는 되돌릴 수 없습니다.</p>
                <code class="cm-typed-target-code cm-path" th:id="${prefix} + 'TypedNameExpected'"
                     ></code>
                <input class="cm-typed-input" type="text"
                       th:id="${prefix} + 'TypedName'"
                       th:name="typedName"
                       autocomplete="off"
                       spellcheck="false"
                       placeholder="자원명 입력">
            </div>

            <div class="n-alert n-alert-danger" th:id="${prefix} + 'Error'" role="alert" hidden></div>

            <div class="cm-actions">
                <button type="button"
                        th:id="${prefix} + 'CancelBtn'"
                        class="n-btn n-btn-secondary">취소
                </button>
                <!-- S5-3-2 — disabled 상태에서도 hover/focus tooltip 표시. wrapper 의 ::after 가 렌더. -->
                <span th:id="${prefix} + 'ReplaceBtnWrap'"
                      class="n-btn-tooltip-wrap"
                      data-tooltip="대체할 기존 자원을 목록에서 고른 뒤 자원명을 정확히 입력해야 합니다.">
                    <button type="button"
                            th:id="${prefix} + 'ReplaceBtn'"
                            class="n-btn n-btn-danger"
                            disabled>기존 영구 삭제 후 등록</button>
                </span>
                <button type="button"
                        th:id="${prefix} + 'ProceedBtn'"
                        class="n-btn n-btn-primary">그래도 등록
                </button>
            </div>
        </div>
    </div>
</div>
</body>
</html>
