<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!--
  공통 레이아웃 프래그먼트
  ─────────────────────────────────────────────────────────────
  commonHead(pageTitle)
    · pageTitle : 브라우저 탭 제목 (예: 'OS 메타데이터 관리')
    · 배경 작업 알림 센터용 CSS/JS 를 모든 페이지에 공통 로드한다.

  navbar(activePage)
    · activePage 키
        Management   : 'os-metadata' | 'board' | 'bios' | 'bmc' | 'driver' | 'raidcard'
        Maintenance  : 'reconciliation' | 'quarantine' | 'trash'
        System       : 'system-asset' | 'pxe-infra'
        Provisioning : 'setting' | 'server'
        Account      : 'users' | 'password'   (S18 — 사이드바 계정 영역)
    · 구현 완료 메뉴는 <a>, 미구현은 <span aria-disabled="true"> 로 남겨
      페이지가 완성될 때 태그만 교체한다.
    · 오른쪽 끝에는 서류가방 아이콘(.n-nav-bgjob) 과 드롭다운 패널이 있어
      장시간 실행되는 모든 배경 작업(추출·업로드·인덱싱·무결성 점검) 을 통합 표시한다.
  ─────────────────────────────────────────────────────────────
-->

<head>
    <th:block th:fragment="commonHead(pageTitle)">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title th:text="'유니와이드 - ' + ${pageTitle}">유니와이드</title>
        <!-- S17-5 — 외부 CDN 0. 브라우저 기본값 정돈은 reset.css(종전 Bootstrap reboot 의 실사용 39 규칙),
             Inter 는 style.css 의 @font-face 가 /fonts/inter/ 에서 싣는다. 인터넷 없는 배포 환경 전제. -->
        <link rel="stylesheet" th:href="@{/global/reset.css}">
        <!-- 전역 디자인 시스템 (DESIGN.md) -->
        <link rel="stylesheet" th:href="@{/global/style.css}">
        <link rel="stylesheet" th:href="@{/css/form-validation.css}">
        <link rel="stylesheet" th:href="@{/css/table-list.css}">
        <!-- 배경 작업 알림 센터 (모든 페이지 공통) -->
        <link rel="stylesheet" th:href="@{/global/background-jobs.css}">
        <!--
          data-bgjob-fail-threshold : /jobs 폴링 연속 실패 임계값 (default 5)
          data-bgjob-fail-grace-ms  : reload 직전 toast 노출 지연 (default 1500ms)
          이 값을 페이지별로 override 하려면 해당 페이지 head 에서 <html> 에
          동일 data-* 를 박아도 된다. (script 속성이 우선)
        -->
        <!-- S17-4 — 화면 스크립트가 공유하는 헬퍼 한 벌(escapeHtml · formatBytes · cssEscape · toast · banner).
             defer 없이 싣는다: body 끝의 페이지 스크립트가 정의 시점에 window.UiUtil 을 봐야 한다(S17-2 F-3 의 순서). -->
        <script th:src="@{/global/ui-util.js}"></script>
        <script th:src="@{/global/background-jobs.js}"
                data-bgjob-fail-threshold="5"
                data-bgjob-fail-grace-ms="1500"
                defer></script>
        <!-- Service Worker 기반 background 업로드 등록기. 모든 페이지에서 window.BackgroundUpload 사용 가능. -->
        <script th:src="@{/global/upload-client.js}" defer></script>
        <!-- S4 — 폼 에러 매핑 단일 진입점 window.FormError. data-error-field / .n-form-banner 결합. -->
        <script th:src="@{/global/form-error.js}" defer></script>
        <!-- HF5 — 병기형 조사('{자원명} 을(를)') 해소 window.KoreanParticle. 확인 modal · error modal 이
             표시 직전 호출하므로 전역 1 회 공급으로 충분하다 (호출 시점이 사용자 조작 이후라 defer 로 안전). -->
        <script th:src="@{/global/korean-particle.js}" defer></script>
        <!-- R1-4-1 hotfix — 전역 error modal. FormSubmit.sendAsync 의 onRejected 가 본 modal 호출 (alert 대체). -->
        <link rel="stylesheet" th:href="@{/css/confirm-modal.css}">
        <script th:src="@{/global/error-modal.js}" defer></script>
        <!-- S10 — 상태 변경 폼의 전역 제출 경로. 가로채기가 기본이고 data-native-submit 이 예외다.
             레이아웃에 두는 이유는 화면이 늘어도 적재 누락이 생기지 않게 하기 위함 — 종전처럼 폼마다
             마커를 붙이는 방식은 마커를 잊는 것이 곧 raw JSON 노출 사고였다(U3-2-b).
             HF9 — PRG 의 flash 는 서버(XhrRedirectFilter)가 XHR 리다이렉트를 200 + X-Redirect-Location 으로 내리고
             form-submit.js 가 브라우저 이동으로 받아 보존한다. flash 를 위해 네이티브로 빠질 이유는 더 없다. -->
        <script th:src="@{/global/form-submit.js}" defer></script>
        <!--/* 화면 이력 스택 — 목록↔상세 왕복의 "어디로 돌아가나" 와 "무엇을 짚나".
               목록이 있는 화면 어디서나 같은 규약(data-nav-key · data-nav-back)이 성립해야 하므로
               페이지별로 싣지 않고 레이아웃에서 한 번 적재한다. */-->
        <script th:src="@{/global/nav-stack.js}" defer></script>
        <!--/* 행 전체 클릭 목록(tr.n-row-clickable[data-href]) 의 위임 — 목록이 있는 화면 어디서나 같은 규약. */-->
        <script th:src="@{/global/row-link.js}" defer></script>
    </th:block>
</head>

<body>
<nav th:fragment="navbar(activePage)" class="n-nav">
    <a th:href="@{/management/os}" class="n-nav-brand">Provision Portal</a>

    <span class="n-nav-group">자원 관리</span>
    <a th:href="@{/management/os}"
       class="n-nav-link"
       th:classappend="${activePage == 'os-metadata'} ? ' active'">OS 버전</a>
    <a th:href="@{/management/board}"
       class="n-nav-link"
       th:classappend="${activePage == 'board'} ? ' active'">메인보드</a>
    <a th:href="@{/management/bios}"
       class="n-nav-link"
       th:classappend="${activePage == 'bios'} ? ' active'">BIOS</a>
    <a th:href="@{/management/bmc}"
       class="n-nav-link"
       th:classappend="${activePage == 'bmc'} ? ' active'">BMC</a>
    <a th:href="@{/management/subprogram}"
       class="n-nav-link"
       th:classappend="${activePage == 'subprogram'} ? ' active'">Driver/Utility</a>
    <!-- MA7 — RAID 카드 (메타 자원). 세팅 정의서의 RAID 구성 지정(U4-1-1)이 참조한다. -->
    <a th:href="@{/management/raidcard}"
       class="n-nav-link"
       th:classappend="${activePage == 'raidcard'} ? ' active'">RAID 카드</a>

    <span class="n-nav-group">운영</span>
    <a th:href="@{/maintenance/reconciliation}"
       class="n-nav-link"
       th:classappend="${activePage == 'reconciliation'} ? ' active'">자원 무결성 점검</a>
    <!-- R9-4 — 업로드 실패 복구(격리 saga)는 무결성 점검과 별개 도메인이라 독립 메뉴로 승격. -->
    <a th:href="@{/maintenance/quarantine}"
       class="n-nav-link"
       th:classappend="${activePage == 'quarantine'} ? ' active'">업로드 실패 복구</a>
    <a th:href="@{/maintenance/trash}"
       class="n-nav-link"
       th:classappend="${activePage == 'trash'} ? ' active'">휴지통</a>

    <!-- System (격리된 시스템 자산 — 자원 도메인 아님. E1-I. 통합 대시보드 = 진단 리눅스·TFTP 영역) -->
    <a th:href="@{/system/asset}"
       class="n-nav-link"
       th:classappend="${activePage == 'system-asset'} ? ' active'">시스템 자산</a>
    <!-- PXE 인프라(dhcpd 임대 · 네트워크 설정)는 종전에 자산 대시보드의 dhcpd 영역 링크로만 닿았고, 네트워크
         설정 폼은 URL 을 직접 쳐야 했다(S17-2). -->
    <a th:href="@{/system/pxe-infra}"
       class="n-nav-link"
       th:classappend="${activePage == 'pxe-infra'} ? ' active'">PXE 인프라</a>

    <span class="n-nav-group">프로비저닝</span>
    <a th:href="@{/provisioning/setting}"
       class="n-nav-link"
       th:classappend="${activePage == 'setting'} ? ' active'">세팅 정의서</a>
    <a th:href="@{/provisioning/bios-setting}"
       class="n-nav-link"
       th:classappend="${activePage == 'bios-setting'} ? ' active'">BIOS 세팅</a>
    <a th:href="@{/provisioning/server}"
       class="n-nav-link"
       th:classappend="${activePage == 'server'} ? ' active'">서버</a>
    <!-- U3-4 — 그룹은 서버 목록과 다른 렌즈다(DEC-D). 목록은 시간 × 스펙, 이쪽은 사람이 정한 묶음. -->
    <a th:href="@{/provisioning/server-group}"
       class="n-nav-link"
       th:classappend="${activePage == 'server-group'} ? ' active'">서버 그룹</a>

    <!-- 오른쪽 끝: 배경 작업 조회 아이콘 + 드롭다운 패널 -->
    <div class="n-nav-spacer"></div>

    <!-- S18 — 계정 영역(D-16). currentUser 는 CurrentUserModelAdvice 가 세션 principal 에서 채운다(비인증이면 없다).
         로그아웃은 POST 폼 — CSRF 를 켤 때 GET 로그아웃이 막히므로 처음부터 POST 다. 필터가 처리하므로 네이티브 제출. -->
    <th:block th:if="${currentUser != null}">
        <span class="n-nav-group">계정</span>
        <span class="n-nav-user" th:text="|${currentUser.name} (${currentUser.username})|">홍길동 (hong.gildong)</span>
        <a th:href="@{/password/change}"
           class="n-nav-link"
           th:classappend="${activePage == 'password'} ? ' active'">비밀번호 변경</a>
        <a th:if="${currentUser.admin}"
           th:href="@{/signup}"
           class="n-nav-link"
           th:classappend="${activePage == 'users'} ? ' active'">사용자 등록</a>
        <form th:action="@{/logout}" method="post" class="n-nav-form"
              data-native-submit="Spring Security 의 로그아웃 필터가 서블릿 앞에서 처리한다">
            <button type="submit" class="n-nav-link n-nav-link-button">로그아웃</button>
        </form>
    </th:block>
    <button type="button"
            id="bgjobTrigger"
            class="n-nav-bgjob"
            aria-label="배경 작업"
            aria-expanded="false"
            aria-controls="bgjobPanel">
        <!-- 서류가방 아이콘 (Material/Lucide 스타일) -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
            <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
        </svg>
        <span id="bgjobDot" class="n-nav-bgjob-dot" hidden></span>
    </button>
    <div id="bgjobPanel"
         class="n-nav-bgjob-panel"
         role="dialog"
         aria-labelledby="bgjobPanelTitle"
         hidden>
        <div class="n-nav-bgjob-panel-header">
            <h2 id="bgjobPanelTitle">
                배경 작업
                <span id="bgjobCount" class="n-nav-bgjob-count">(0)</span>
            </h2>
            <button type="button" id="bgjobClear" class="n-nav-bgjob-clear" disabled>모두 지우기</button>
        </div>
        <div class="n-nav-bgjob-panel-body">
            <div id="bgjobEmpty" class="n-nav-bgjob-empty">진행 중인 작업이 없습니다.</div>
            <ul id="bgjobList" class="n-nav-bgjob-list" hidden></ul>
        </div>
    </div>
</nav>
</body>

</html>
