<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--
  세팅 정의서 상세 페이지
  ─────────────────────────────────────────────────────────
  Model:
    setting : SettingDetailResponse
                · id / name / createdAt / updatedAt
                · deprecatedUsages : List<DeprecatedUsageResponse{processType, resourceNames}>
                  — deprecated 자원을 사용 중인 단계 표시 (조회 시점 판정).
                    단계 카드 head 에 '지원 중단 자원 사용' 뱃지 + title 툴팁(자원명 목록)으로 렌더.
                · executionWarnings : List<ExecutionWarningResponse{processType, warnings}>
                  — 실행 시 건너뜀 가능 안내(예: SPECIFIED 보드+최신 버전, 등록 펌웨어 0개) — 동일 뱃지 관용구.
                · processList : List<AbstractProcessRequest> — 다형 단계 목록.
                  타입 분기는 instanceof 사다리가 아닌 다형 accessor 로 수행한다 :
                    process.processType() : SettingProcessType (1단 판별)
                    process.osFamily()    : OSFamily (OS 단계의 2단 판별 → detail-rhel/debian fragment)
                · references.templates : Map<Long,String> (BIOS 세팅 템플릿 id→이름 — U2-2-3,
                  BASIC_SETTING 단계의 process.biosSettingTemplateIds 뱃지 명칭 해석)

  주의 : U2-1 은 계약 슬라이스라 보드/BIOS/BMC/OS/환경이 ID 로만 표시된다 —
        management 실데이터 명칭 해석은 U2-2 의 책임.
-->
<head>
    <th:block th:replace="~{fragments/layout :: commonHead('세팅 정의서 상세')}"></th:block>
    <link rel="stylesheet" th:href="@{/provisioning/setting.css}">
</head>
<body>
<nav th:replace="~{fragments/layout :: navbar('setting')}"></nav>

<div class="n-page-lg">
    <div class="n-page-header">
        <h1 class="n-page-title" th:text="${setting.name}">정의서 명칭</h1>
        <div th:replace="~{fragments/common/back-link :: backLink('/provisioning/setting')}"></div>
    </div>

    <!-- soft-deleted 안내 배너 — 삭제분에 접근했을 때 복원/영구삭제 유도(DEC-F). -->
    <div th:if="${setting.deleted}" class="n-card n-detail-section">
        <div class="n-card-body">
            <p class="n-detail-empty">이 정의서는 삭제되어 활성 목록에서 숨겨져 있습니다.
                <th:block th:if="${setting.referencingCount > 0}">
                    <span th:text="|${setting.referencingCount}개 게스트에 활성 할당돼 있지만 할당 스냅샷은 소프트 참조라 삭제·영구삭제와 무관하게 유지됩니다.|"></span>
                </th:block>
                복원하거나 영구 삭제할 수 있습니다.</p>
        </div>
    </div>

    <!-- 메타 정보 -->
    <div class="n-detail-section">
        <div class="n-section-title">기본 정보</div>
        <div class="n-card">
            <div class="n-card-body">
                <table class="n-detail-table">
                    <tbody>
                    <!--/* 상태를 바꾸는 조작은 그 상태가 보이는 행에 둔다. 배지는 지금 값,
                           옆의 버튼은 그 값을 바꾸는 동작이다. */-->
                    <tr th:if="${setting.deleted}">
                        <th>상태</th>
                        <td><span class="n-badge n-badge-gray">삭제됨</span></td>
                    </tr>
                    <tr th:unless="${setting.deleted}">
                        <th>사용 여부</th>
                        <td>
                            <div class="n-actions">
                                <span class="n-badge"
                                      th:classappend="${setting.enabled} ? 'n-badge-green' : 'n-badge-off'"
                                      th:text="${setting.enabled} ? '활성' : '비활성'">활성</span>
                                <form method="post" class="n-inline-form"
                                      th:action="@{/provisioning/setting/{id}/toggle(id=${setting.id})}">
                                    <button type="submit" class="n-btn n-btn-sm"
                                            th:classappend="${setting.enabled} ? 'n-btn-outline' : 'n-btn-outline-success'"
                                            th:text="${setting.enabled} ? '비활성화' : '활성화'"
                                            th:title="${setting.enabled}
                                                      ? '비활성화하면 이 정의서를 서버에 새로 할당할 수 없습니다(기존 할당은 유지).'
                                                      : '활성화하면 이 정의서를 다시 할당할 수 있습니다.'">비활성화</button>
                                </form>
                            </div>
                            <p class="n-hint">비활성 정의서는 서버에 새로 할당할 수 없습니다. 이미 할당된 스냅샷은 그대로 유지됩니다.</p>
                        </td>
                    </tr>
                    <tr th:unless="${setting.deleted}">
                        <th>사용 중단 권고</th>
                        <td>
                            <div class="n-actions">
                                <span class="n-badge"
                                      th:classappend="${setting.deprecated} ? 'n-badge-yellow' : 'n-badge-gray'"
                                      th:text="${setting.deprecated} ? '사용 중단' : '해당 없음'">해당 없음</span>
                                <form method="post" class="n-inline-form"
                                      th:action="${setting.deprecated}
                                                 ? @{/provisioning/setting/{id}/undeprecate(id=${setting.id})}
                                                 : @{/provisioning/setting/{id}/deprecate(id=${setting.id})}">
                                    <button type="submit" class="n-btn n-btn-sm n-btn-outline-warning"
                                            th:text="${setting.deprecated} ? '사용 중단 권고 해제' : '사용 중단 권고'">사용 중단 권고</button>
                                </form>
                            </div>
                            <p class="n-hint">사용 중단을 권고해도 할당은 계속 가능합니다. 정의서를 고를 때 경고만 붙습니다.</p>
                        </td>
                    </tr>
                    <tr>
                        <th>정의서 ID</th>
                        <td><code class="n-mono" th:text="${setting.id}">1</code></td>
                    </tr>
                    <tr>
                        <th>생성일시</th>
                        <td th:text="${setting.createdAt != null} ? ${#temporals.format(setting.createdAt, 'yyyy-MM-dd HH:mm:ss')} : '—'">—</td>
                    </tr>
                    <tr>
                        <th>수정일시</th>
                        <td th:text="${setting.updatedAt != null} ? ${#temporals.format(setting.updatedAt, 'yyyy-MM-dd HH:mm:ss')} : '—'">—</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
            <!--/* 자원 자체를 다루는 조작은 그 자원의 정보 아래에 둔다 — 서버 상세의
                   '변경 사항 저장' 과 같은 자리다. 제목 줄에 두면 제목보다 먼저 눈에 들어오고,
                   화면마다 버튼 수가 달라 '목록으로' 의 높이까지 흔들린다. */-->
    <div class="n-form-actions">
        <th:block th:unless="${setting.deleted}">
            <a th:href="@{/provisioning/setting/{id}/edit(id=${setting.id})}"
               class="n-btn n-btn-secondary">수정</a>
            <form method="post" class="n-inline-form"
                  th:action="@{/provisioning/setting/{id}/delete(id=${setting.id})}"
                  data-confirm-soft-delete=""
                  th:data-resource-label="|정의서 '${setting.name}'|"
                  th:data-referencing-count="${setting.referencingCount}">
                <button type="submit" class="n-btn n-btn-outline-danger">삭제</button>
            </form>
        </th:block>
        <th:block th:if="${setting.deleted}">
            <form method="post" class="n-inline-form"
                  th:action="@{/provisioning/setting/{id}/restore(id=${setting.id})}">
                <button type="submit" class="n-btn n-btn-outline-info">복구</button>
            </form>
            <form method="post" class="n-inline-form"
                  th:action="@{/provisioning/setting/{id}/purge(id=${setting.id})}"
                  data-confirm-purge=""
                  th:data-resource-label="|정의서 '${setting.name}'|"
                  th:data-typed-name="${setting.name}">
                <button type="submit" class="n-btn n-btn-danger">영구 삭제</button>
            </form>
        </th:block>
    </div>
    </div>

    <!-- 프로비저닝 단계 -->
    <div class="n-detail-section">
        <div class="n-section-title">프로비저닝 단계</div>

        <!--/* 카드 렌더는 조각이 갖는다 — 서버 상세의 정의서 선택 모달이 같은 한 벌을 쓴다(U3-5-b DEC-A). */-->
        <th:block th:replace="~{fragments/provisioning/setting-process-cards :: processCards(${setting})}"></th:block>
    </div>
</div>

<!-- U3-2-b — 삭제/영구삭제 확인 모달(관리 공용 fragment 사전 include) + base opener + setting 전용 바인딩.
     purge lazy 흐름은 ResourceType 레지스트리를 전제하므로 쓰지 않고, 사전 include 한 fragment 를
     ConfirmModal.open 으로 직접 구동한다. -->
<link rel="stylesheet" th:href="@{/css/confirm-modal.css}">
<div th:replace="~{fragments/management/confirm-soft-delete :: confirmSoftDeleteModal('confirmSoftDelete')}"></div>
<div th:replace="~{fragments/management/confirm-purge :: confirmPurgeModal('confirmPurge')}"></div>
<script th:src="@{/management/common/confirm-modal-base.js}"></script>
<script th:src="@{/provisioning/setting-lifecycle.js}"></script>

</body>
</html>
