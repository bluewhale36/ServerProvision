<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--
  세팅 정의서 목록 페이지
  ─────────────────────────────────────────────────────────
  Model:
    settings : List<SettingSummaryResponse>
                 · id           : Long
                 · name         : String
                 · processTypes : List<SettingProcessType> (단계 요약 배지)
                 · deleted      : boolean (삭제됨 배지 — includeDeleted 목록에서만 등장)
                 · enabled      : boolean (false 면 '비활성' 배지 — 신규 할당 차단, U3-2-b DEC-G)
                 · deprecated   : boolean (true 면 '사용 중단' 배지 — 할당은 허용, 경고만)
                 · createdAt    : LocalDateTime

  행 클릭 시 /provisioning/setting/{id} 상세로 이동.
-->
<head>
    <th:block th:replace="~{fragments/layout :: commonHead('세팅 정의서')}"></th:block>
    <link rel="stylesheet" th:href="@{/provisioning/setting.css}">
</head>
<body>
<nav th:replace="~{fragments/layout :: navbar('setting')}"></nav>

<div class="n-page">
    <div class="n-page-header">
        <h1 class="n-page-title">세팅 정의서</h1>
        <div class="n-header-actions">
            <!-- U3-2-b — 휴지통 토글(os 선례 DEC-F). on 이면 삭제분도 목록에 노출(삭제 배지). -->
            <label class="n-checkbox">
                <input type="checkbox"
                       th:checked="${includeDeleted}"
                       id="settingIncludeDeletedToggle">
                삭제된 항목 포함
            </label>
            <a th:href="@{/provisioning/setting/new}" class="n-btn n-btn-primary">새 정의서 작성</a>
        </div>
    </div>

    <!-- 빈 상태 -->
    <div th:if="${#lists.isEmpty(settings)}" class="n-card">
        <div class="n-empty">
            <div class="n-empty-title">등록된 세팅 정의서가 없습니다.</div>
            <div class="n-empty-desc">새 정의서 작성 버튼을 눌러 첫 번째 정의서를 만들어보세요.</div>
        </div>
    </div>

    <!-- 정의서 목록 -->
    <div th:unless="${#lists.isEmpty(settings)}" class="n-card">
        <table class="n-table" id="settingTable">
            <thead>
            <tr>
                <th class="n-th-center">#</th>
                <th>정의서 명칭</th>
                <th class="n-th-center">활성</th>
                <th class="n-th-center">사용 중단</th>
                <th>포함 단계</th>
                <th>생성일시</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="setting : ${settings}"
                class="n-row-clickable"
                th:data-href="@{/provisioning/setting/{id}(id=${setting.id})}">
                <td class="n-td-id" th:text="${setting.id}">1</td>
                <td>
                    <a class="n-row-link"
                       th:href="@{/provisioning/setting/{id}(id=${setting.id})}"
                       th:text="${setting.name}">정의서 명칭</a>
                    <span th:if="${setting.deleted}" class="n-badge n-badge-red">삭제됨</span>
                </td>
                <!-- U3-2-b DEC-G — 활성 축: 비활성이면 신규 할당만 차단되고 이미 만들어진 할당 스냅샷은 무영향.
                     삭제된 정의서는 두 축이 의미를 잃으므로 '-' 로 비운다. -->
                <td class="n-td-center">
                    <span th:if="${setting.deleted}" class="n-table-muted">-</span>
                    <span th:if="${!setting.deleted and setting.enabled}"
                          class="n-badge n-badge-green"
                          title="서버에 새로 할당할 수 있는 정의서입니다.">활성</span>
                    <span th:if="${!setting.deleted and !setting.enabled}"
                          class="n-badge n-badge-off"
                          title="비활성 정의서는 서버에 새로 할당할 수 없습니다.">비활성</span>
                </td>
                <!-- 사용 중단 축: 할당을 막지 않고 권고만 한다 — 정상은 값 없음('-'), 권고는 노란 배지. -->
                <td class="n-td-center">
                    <span th:if="${setting.deleted or !setting.deprecated}" class="n-table-muted">-</span>
                    <span th:if="${!setting.deleted and setting.deprecated}"
                          class="n-badge n-badge-yellow"
                          title="사용 중단이 권고된 정의서입니다. 할당은 가능하지만 다른 정의서 사용을 권장합니다.">사용 중단 권고</span>
                </td>
                <td>
                    <span th:if="${#lists.isEmpty(setting.processTypes)}" class="n-table-muted">-</span>
                    <span th:unless="${#lists.isEmpty(setting.processTypes)}" class="n-badge-list">
                        <span class="n-badge n-badge-blue"
                              th:each="type : ${setting.processTypes}"
                              th:text="${type.displayName}">단계</span>
                    </span>
                </td>
                <td>
                    <span th:if="${setting.createdAt != null}"
                          th:text="${#temporals.format(setting.createdAt, 'yyyy-MM-dd HH:mm')}">2026-07-01 12:00</span>
                    <span th:unless="${setting.createdAt != null}" class="n-table-muted">-</span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- 행 클릭은 전역 row-link.js 가 맡는다. 휴지통 토글만 이 화면 고유. -->
<script th:src="@{/provisioning/setting-list.js}"></script>

</body>
</html>
