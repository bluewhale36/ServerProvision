<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--
  게스트 서버 그룹 목록 (U3-4 · S8-1 — 검색 · 필터 · 정렬 · 페이징)
  ─────────────────────────────────────────────────────────
  Model:
    page        : Page<GroupSummaryResponse> — 조회 조건으로 거른 한 쪽(기본 만든 시각 최신순, Q2)
    query       : GroupListQuery — 조회 띠의 현재 상태(q · hasStandardDefinition · sort · dir)
    links       : ListLinks — 쪽 이동 · 초기화 링크
    sortFields  : GroupSortField[] — 정렬 항목 셀렉트 선택지
    sortDefault : GroupSortField — 정렬 항목 기본값

  이 화면이 서버 목록과 별개인 이유(DEC-D): 그룹은 시간 축을 가로지른다.
  나중에 합류한 서버는 다른 시간 묶음에 속하므로, 서버 목록의 '시간 → 스펙' 계층
  안에는 그룹이 들어갈 자리가 없다. 두 화면이 서로 다른 렌즈를 갖는다.

  조회 띠의 규칙은 세팅 정의서 목록과 같다 — GET 폼 · 상태는 URL · 즉시 제출(global/list-query.js) · 제출은 첫 쪽.
  표준 정의서 지정 여부는 표의 열로 드러나지 않고 필터로만 쓰인다(열은 셋 그대로).
-->
<head>
    <th:block th:replace="~{fragments/layout :: commonHead('서버 그룹')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/grouped-list.css}">
    <link rel="stylesheet" th:href="@{/provisioning/server.css}">
</head>
<body>
<nav th:replace="~{fragments/layout :: navbar('server-group')}"></nav>

<div class="n-page">
    <div class="n-page-header">
        <h1 class="n-page-title">서버 그룹</h1>
        <div class="n-header-actions">
            <span class="n-hint">여러 대를 하나로 묶어 함께 다루기 위한 이름입니다. 멤버는 언제든 넣고 뺄 수 있습니다.</span>
            <a class="n-btn n-btn-primary" th:href="@{/provisioning/server-group/new}">새 그룹</a>
        </div>
    </div>

    <!-- 조회 띠 — 검색 · 필터 · 정렬. 상태는 URL 에 있다(S8-1). -->
    <form id="listQuery" class="n-filter-bar" method="get" th:action="@{/provisioning/server-group}" data-list-query>
        <div class="n-filter-search">
            <input class="n-input" type="search" name="q" th:value="${query.q}"
                   placeholder="예: 8월 2차" aria-label="그룹 이름 검색">
            <button type="submit" class="n-btn n-btn-secondary n-btn-sm" th:text="#{action.search}">검색</button>
        </div>

        <div class="n-filter-group" role="group" aria-label="표준 정의서">
            <span class="n-filter-label">표준 정의서</span>
            <label class="n-chip"><input type="radio" name="hasStandardDefinition" value="" th:checked="${query.hasStandardDefinition == null}">전체</label>
            <label class="n-chip"><input type="radio" name="hasStandardDefinition" value="true" th:checked="${query.hasStandardDefinition == true}">지정됨</label>
            <label class="n-chip"><input type="radio" name="hasStandardDefinition" value="false" th:checked="${query.hasStandardDefinition == false}">미지정</label>
        </div>

        <div th:replace="~{fragments/ui/sort-selects :: selects(${sortFields}, ${query}, ${sortDefault})}"></div>

        <div class="n-filter-summary">
            <span>결과 <b th:text="${page.totalElements}">0</b>건</span>
            <a th:if="${query.filtered}" th:href="${links.reset()}" th:text="#{action.reset}">초기화</a>
        </div>
    </form>

    <!-- 빈 상태 — 조건 때문에 비었는지, 아예 없는지를 가른다(S8-1 R8) -->
    <div th:if="${page.totalElements == 0}" class="n-card">
        <div class="n-empty">
            <th:block th:if="${query.filtered}">
                <div class="n-empty-title" th:text="#{provisioning.group.list.empty-filtered}">조건에 맞는 그룹이 없습니다.</div>
                <div class="n-empty-desc">조건을 바꾸거나 <a th:href="${links.reset()}" th:text="#{action.reset}">초기화</a>하면 전체 목록이 보입니다.</div>
            </th:block>
            <th:block th:unless="${query.filtered}">
                <div class="n-empty-title">만들어진 그룹이 없습니다.</div>
                <div class="n-empty-desc">
                    <a th:href="@{/provisioning/server}">게스트 서버 목록</a> 의 스펙 묶음에서 그대로 만들거나,
                    <a th:href="@{/provisioning/server-group/new}">빈 그룹</a> 을 먼저 만들고 나중에 채울 수 있습니다.
                </div>
            </th:block>
        </div>
    </div>

    <!-- 범위 밖 쪽 — 결과는 있는데 이 쪽이 빈 상태 -->
    <div th:if="${page.totalElements > 0 and page.content.isEmpty()}" class="n-card">
        <div class="n-empty">
            <div class="n-empty-title">이 페이지에는 항목이 없습니다.</div>
            <div class="n-empty-desc"><a th:href="${links.page(0)}">첫 페이지</a>로 돌아가면 목록이 보입니다.</div>
        </div>
    </div>

    <div th:if="${!page.content.isEmpty()}" class="n-card">
        <table class="n-table n-table-groups">
            <thead>
            <tr>
                <th>이름</th>
                <th>멤버</th>
                <th>만든 시각</th>
            </tr>
            </thead>
            <tbody>
            <!--/* 행 전체는 클릭 대상이 아니다(개정) — 이동은 이름 링크만 한다. */-->
            <tr th:each="g : ${page.content}" class="n-row-hover" th:data-nav-key="${g.id}">
                <td>
                    <a class="n-row-link" th:href="@{/provisioning/server-group/{id}(id=${g.id})}"
                       th:text="${g.name}">8월 2차</a>
                    <!--/* 구성 혼재를 자원 화면의 사용 중단과 같은 방식으로 알린다 —
                           목록에서 열어보기 전에 손볼 것이 있는지 보이게. 문장이 아니라 표식이라
                           행이 늘어도 목록이 시끄러워지지 않는다. */-->
                    <span th:if="${g.specDiverged}" class="n-deprecated-dot n-tooltip"
                          data-tooltip="구성 혼재 — 하드웨어 구성이 다른 서버가 섞여 있습니다"></span>
                </td>
                <td th:text="${g.memberCount} + '대'">3대</td>
                <!--/* 구성 혼재 여부는 여기 두지 않는다 — 판정에는 멤버와 서버 상세가 필요한데(N+1), 그 안내가
                       필요한 자리는 상세 화면이다(DEC-I). S8-1 부터 판정은 보이는 쪽의 그룹만 대상으로 한다. */-->
                <td th:text="${#temporals.format(g.createdAt, 'yyyy-MM-dd HH:mm')}">2026-08-11 16:00</td>
            </tr>
            </tbody>
        </table>

        <!--/* 표와 쪽 이동은 붙어 다닌다 — 판 바닥의 한 줄(S8-1). */-->
        <div th:replace="~{fragments/ui/pagination :: pager(${page}, ${links})}"></div>
    </div>
</div>

<!-- 조회 띠의 즉시 제출 · 빈 값 정리(S8-1) -->
<script th:src="@{/global/list-query.js}"></script>

</body>
</html>
