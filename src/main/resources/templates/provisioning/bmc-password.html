<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- S17-1 — 공통 head(전역 시트 · 배경 작업 · 폼 스크립트)와 사이드바를 싣는다. 이 폼은 method 가 없어(GET)
         전역 form-submit 가로채기 대상이 아니고, 자체 스크립트가 submit 을 preventDefault 로 받는다. -->
    <th:block th:replace="~{fragments/layout :: commonHead('BMC 비밀번호 변경')}"></th:block>
    <!-- v 쿼리 = 캐시버스터 (스타일 변경 시 증가) -->
</head>
<body>
<nav th:replace="~{fragments/layout :: navbar('bios-setting')}"></nav>

<div class="n-page-md">
    <div class="n-page-header">
        <h1 class="n-page-title">BMC 비밀번호 변경</h1>
        <div class="n-header-actions">
            <!-- 구 /provisioning/bios-setup 라우트 폐지(U2-2-1) — BIOS 세팅 템플릿 목록으로 재지향 -->
            <a th:href="@{/provisioning/bios-setting}" class="n-back-link">← BIOS 세팅으로</a>
        </div>
    </div>
    <p class="n-hint n-lead">
        입력 후 전송하면 실제 BMC 에 보내야 할 Redfish 요청(경로 · method · body)을 표시합니다.
        서버는 실제 호출 없이 로그만 남깁니다 (비밀번호는 로그에서 마스킹).
    </p>

    <div class="n-card">
        <div class="n-card-body">
            <form id="bmcForm" th:attr="data-plan-url=@{/provisioning/bmc-password/plan}">
                <div class="n-form-group">
                    <label class="n-label" for="bmcIp">BMC IP <span class="n-note">(선택 — 표시용)</span></label>
                    <input id="bmcIp" class="n-input" type="text" placeholder="192.168.0.100" autocomplete="off">
                </div>
                <div class="n-form-group">
                    <label class="n-label" for="bmcAccountId">계정 ID</label>
                    <input id="bmcAccountId" class="n-input" type="text" inputmode="numeric" placeholder="2" required
                           autocomplete="off">
                    <p class="n-hint">GET /redfish/v1/AccountService/Accounts 의 Members 로 확인 (admin 은 보통 2)</p>
                </div>
                <div class="n-form-group">
                    <label class="n-label" for="bmcUserName">계정명 <span class="n-note">(선택 — 참고 표시용)</span></label>
                    <input id="bmcUserName" class="n-input" type="text" placeholder="admin" autocomplete="off">
                </div>
                <div class="n-form-group">
                    <label class="n-label" for="bmcPassword">새 비밀번호</label>
                    <input id="bmcPassword" class="n-input" type="password" required autocomplete="new-password">
                </div>
                <div class="n-form-group">
                    <label class="n-label" for="bmcPasswordConfirm">새 비밀번호 확인</label>
                    <input id="bmcPasswordConfirm" class="n-input" type="password" required autocomplete="new-password">
                </div>

                <p id="bmcFormError" class="n-error" hidden></p>

                <div class="n-form-actions">
                    <button type="submit" class="n-btn n-btn-primary">전송</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 적용 계획 결과 -->
    <section id="bmcResult" class="n-card n-detail-section" hidden>
        <div class="n-card-body">
            <h2 class="n-card-title">Redfish 적용 계획</h2>
            <p class="n-hint n-lead">아래 요청을 BMC 에 그대로 보내면 됩니다 (서버 로그에도 마스킹 기록됨).</p>
            <pre class="n-code-block" id="bmcRequestLine"></pre>
            <p class="n-hint n-block-gap n-lead">Request Body:</p>
            <pre class="n-code-block" id="bmcRequestBody"></pre>
            <p class="n-note n-block-gap" id="bmcNote"></p>
        </div>
    </section>
</div>

<script th:src="@{/provisioning/bmc-password.js}"></script>
</body>
</html>
