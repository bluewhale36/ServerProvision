<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--
  MA8 — 사용자 추가(사용자 관리). 최고 관리자만 도달한다(SecurityConfig /users/**). 초기 비밀번호와 권한 등급을 정해 계정을 만들고,
  그 계정은 첫 로그인에서 비밀번호 변경을 요구받는다. 폼은 fragments/security/signup-form 을 최초 관리자 등록 화면과 공유한다.
  (S18 의 관리자 모드 화면 security/signup.html 을 옮겨 왔다 — 계정 생성이 사용자 관리로 통합됨, 사용자 결정 U-3)
-->
<head>
    <th:block th:replace="~{fragments/layout :: commonHead('사용자 추가')}"></th:block>
</head>
<body>
<nav th:replace="~{fragments/layout :: navbar('users')}"></nav>

<div class="n-page-md">
    <div class="n-page-header">
        <h1 class="n-page-title">사용자 추가</h1>
        <div th:replace="~{fragments/common/back-link :: backLink('/users')}"></div>
    </div>

    <div class="n-card">
        <div class="n-card-body">
            <th:block th:replace="~{fragments/security/signup-form :: signupForm}"></th:block>
        </div>
    </div>
</div>
<script th:src="@{/global/password-toggle.js}"></script>
</body>
</html>
