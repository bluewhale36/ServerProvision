<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--
  E1-I-2-b-2. 진단 리눅스 자산 현황 대시보드 (status-only).
  ─────────────────────────────────────────────────────────
  대시보드는 자원 상태를 한눈에 보는 곳이다 — 상태를 바꾸는 액션(교체·롤백·봉인·보존설정)은 두지 않는다.
  각 자산 행을 클릭하면 그 자산 상세로 이동해 교체·롤백·이력 조회를 하고, 봉인·보존 개수는 운영 설정에서 한다.

  Model:
    dashboard : SystemAssetDashboardResponse (servingActive / assetsRoot / baseUrl / slots / okCount / totalCount)
    flashMessage : String (재검증 등 PRG flash — optional)

  액션 (여기 유일한 비변경 새로고침):
    · 재검증 → POST /system/diagnostic-asset/recheck (디스크 재대조 후 새로고침)
  네비게이션:
    · 자산 행 클릭 → GET /system/diagnostic-asset/{slot} (상세)
    · 운영 설정 → GET /system/diagnostic-asset/settings
-->
<head>
    <th:block th:replace="~{fragments/layout :: commonHead('진단 리눅스 자산')}"></th:block>
    <link rel="stylesheet" th:href="@{/system/diagnostic-asset.css}">
</head>
<body>
<nav th:replace="~{fragments/layout :: navbar('diagnostic-asset')}"></nav>

<div class="n-page">
    <div class="n-page-header">
        <h1 class="n-page-title">진단 리눅스 자산</h1>
        <div class="n-header-actions">
            <span class="n-hint da-muted-sm">PXE 부팅 자산 6종의 무결성 현황입니다. 교체·롤백은 각 자산을 클릭해 상세에서, 봉인·보존 개수는 운영 설정에서 합니다.</span>
            <form th:action="@{/system/diagnostic-asset/recheck}" method="post" class="da-inline-form">
                <button type="submit" class="n-btn n-btn-secondary n-btn-sm"
                        th:disabled="${!dashboard.servingActive}"
                        title="디스크를 다시 해시해 무결성을 재대조합니다.">재검증</button>
            </form>
            <a th:href="@{/system/diagnostic-asset/settings}" class="n-btn n-btn-secondary n-btn-sm">운영 설정 →</a>
        </div>
    </div>

    <!--/* PRG flash */-->
    <div th:if="${flashMessage}" class="n-alert n-alert-success da-summary" th:text="${flashMessage}"></div>

    <!--/* 서빙 상태 요약 */-->
    <div class="n-hint da-summary">
        <span th:if="${dashboard.servingActive}" class="n-badge n-badge-green">서빙 활성</span>
        <span th:unless="${dashboard.servingActive}" class="n-badge n-badge-gray">서빙 비활성</span>
        <span th:if="${dashboard.servingActive}">
            <span th:text="'무결성 일치 ' + ${dashboard.okCount} + ' / ' + ${dashboard.totalCount}"></span>
            · 루트 <code class="da-mono" th:text="${dashboard.assetsRoot}"></code>
            · base-url <code class="da-mono" th:text="${dashboard.baseUrl}"></code>
        </span>
        <span th:unless="${dashboard.servingActive}">
            자산 서빙이 꺼져 있습니다 — <code class="da-mono">PXE_ASSETS_ROOT</code> 미설정. 자산 위치를 알 수 없어 조회가 비활성입니다.
        </span>
    </div>

    <!--/* 6 슬롯 현황 — 행 클릭 시 상세로 이동 */-->
    <table id="diagnosticAssetTable" class="n-table">
        <thead>
        <tr>
            <th>자산</th>
            <th>종류</th>
            <th>구성</th>
            <th>크기</th>
            <th>최종 수정</th>
            <th>무결성</th>
            <th>교체 주기</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="slot : ${dashboard.slots}" class="n-row-clickable"
            th:data-href="@{/system/diagnostic-asset/{k}(k=${slot.key})}">
            <td>
                <div th:text="${slot.label}"></div>
                <span class="da-filename" th:text="${slot.filename}"></span>
            </td>
            <td><span class="n-badge n-badge-gray" th:text="${slot.category}"></span></td>
            <td class="da-muted-sm" th:text="${slot.layoutLabel}"></td>
            <td th:text="${slot.sizeDisplay}"></td>
            <td>
                <span th:if="${slot.modifiedAt != null}"
                      th:text="${#temporals.format(slot.modifiedAt, 'yyyy-MM-dd HH:mm:ss')}"></span>
                <span th:if="${slot.modifiedAt == null}" class="da-muted">—</span>
            </td>
            <td><span class="n-badge" th:classappend="${slot.badgeClass}" th:text="${slot.statusLabel}"></span></td>
            <td class="da-muted-sm" th:text="${slot.replaceCadence}"></td>
        </tr>
        </tbody>
    </table>
</div>

<script th:src="@{/system/diagnostic-asset.js}" defer></script>
</body>
</html>
