<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--
  E1-I-3-a. 통합 시스템 자산 대시보드 (status-only, 다중 영역).
  ─────────────────────────────────────────────────────────
  격리된 시스템 자산 영역(진단 리눅스·TFTP)을 한 화면에 영역별로 나눠 보여준다. 대시보드는 현황을 보는
  곳이라 상태를 바꾸는 액션은 영역 봉인과 비변경 재검증만 둔다 — 교체·롤백·이력은 각 영역의 상세로 간다.

  Model:
    overview : SystemAssetOverviewResponse
                 · areas : List<SystemAssetAreaGroupResponse>
                     (areaKey / displayName / availability / slots / okCount / totalCount / supportsSeal)
                 · totalOk / totalCount : 전 영역 집계
    flashMessage : String (봉인·재검증 PRG flash — optional)

  액션 · 네비게이션:
    · 재검증        → POST /system/asset/recheck (전 영역 재대조 후 새로고침)
    · 영역 봉인      → POST /system/asset/{areaKey}/seal (supportsSeal && 서빙 활성일 때만)
    · 운영 설정      → GET  /system/asset/settings
    · 진단 자산 행 클릭 → GET /system/diagnostic-asset/{slot} (상세 — 진단 영역만, TFTP 는 읽기 전용)
-->
<head>
    <th:block th:replace="~{fragments/layout :: commonHead('시스템 자산')}"></th:block>
    <link rel="stylesheet" th:href="@{/system/diagnostic-asset.css}">
    <link rel="stylesheet" th:href="@{/system/asset.css}">
</head>
<body>
<nav th:replace="~{fragments/layout :: navbar('system-asset')}"></nav>

<div class="n-page">
    <div class="n-page-header">
        <h1 class="n-page-title">시스템 자산</h1>
        <div class="n-header-actions">
            <span class="n-hint da-muted-sm">격리된 시스템 자산 영역의 무결성 현황입니다. 교체·롤백은 각 자산을 클릭해 상세에서, 보존 개수는 운영 설정에서 합니다.</span>
            <form th:action="@{/system/asset/recheck}" method="post" class="da-inline-form">
                <button type="submit" class="n-btn n-btn-secondary n-btn-sm"
                        title="디스크를 다시 해시해 무결성을 재대조합니다.">재검증</button>
            </form>
            <a th:href="@{/system/asset/settings}" class="n-btn n-btn-secondary n-btn-sm">운영 설정 →</a>
        </div>
    </div>

    <!--/* PRG flash */-->
    <div th:if="${flashMessage}" class="n-alert n-alert-success da-summary" th:text="${flashMessage}"></div>

    <!--/* 전 영역 집계 요약 */-->
    <div class="n-hint da-summary">
        <span class="n-badge n-badge-gray"
              th:text="'전체 정상 ' + ${overview.totalOk} + ' / ' + ${overview.totalCount}"></span>
    </div>

    <!--/* 영역별 표 — 영역이 늘어도(확장점 구현 추가) 이 반복만으로 렌더된다 */-->
    <section class="asset-area" th:each="area : ${overview.areas}">
        <div class="asset-area-header">
            <div class="asset-area-heading">
                <h2 class="asset-area-title" th:text="${area.displayName}">영역명</h2>
                <span class="n-badge"
                      th:classappend="${area.availability == 'CONFIGURED'} ? 'n-badge-green' : 'n-badge-gray'"
                      th:text="${area.availability == 'CONFIGURED'} ? '서빙 활성' : '서빙 비활성'"></span>
                <span class="n-badge n-badge-gray"
                      th:text="'정상 ' + ${area.okCount} + ' / 전체 ' + ${area.totalCount}"></span>
                <!--/*
                  영역 헤더 관측 chip — 슬롯이 아닌 부수 관측치(dhcpd 서비스 상태·활성 임대 건수 등)를 배지로 얹는다.
                  파일 봉인 영역(진단·TFTP)은 context 가 빈 목록이라 아무것도 렌더되지 않는다(무변경).
                */-->
                <span class="n-badge" th:each="c : ${area.context}"
                      th:classappend="${c.badgeClass}" th:text="${c.label} + ' ' + ${c.value}"></span>
                <!--/* dhcpd 영역만 임대 명세 페이지로 이동(그 영역만 임대 목록을 보유) */-->
                <a th:if="${area.areaKey == 'DHCPD'}" th:href="@{/system/pxe-infra}"
                   class="da-muted-sm">임대 목록 →</a>
            </div>
            <!--/* 봉인 버튼: 봉인 지원 영역만 렌더(supportsSeal), 서빙 비활성이면 disabled — 서버 가드와 동일 SSOT */-->
            <form th:if="${area.supportsSeal}" method="post" class="da-inline-form"
                  th:action="@{/system/asset/{k}/seal(k=${area.areaKey})}">
                <button type="submit" class="n-btn n-btn-warning n-btn-sm"
                        th:disabled="${area.availability != 'CONFIGURED'}"
                        th:title="${area.availability == 'CONFIGURED'}
                                  ? '존재하는 자산의 현재 해시를 무결성 기준으로 기록합니다.'
                                  : '서빙이 비활성이라 봉인할 수 없습니다.'">봉인</button>
            </form>
        </div>

        <table class="n-table n-asset-table">
            <thead>
            <tr>
                <th>자산</th>
                <th>종류</th>
                <th>구성</th>
                <th>크기</th>
                <th>최종 수정</th>
                <th>무결성</th>
                <th>교체 주기</th>
            </tr>
            </thead>
            <tbody>
            <!--/*
              진단 영역 행만 상세(/system/diagnostic-asset/{slot})로 이동한다 — 그 영역만 교체·롤백·이력 상세를
              보유한다. TFTP 등 읽기 전용 영역은 링크를 붙이지 않는다. 링크 대상 URL 네임스페이스가 영역마다
              달라 presentation 층에서 한 번 갈린다(도메인 로직 분기 아님).
            */-->
            <tr th:each="slot : ${area.slots}"
                th:classappend="${area.areaKey == 'DIAGNOSTIC'} ? ' n-row-clickable'"
                th:attr="data-href=${area.areaKey == 'DIAGNOSTIC'} ? @{/system/diagnostic-asset/{k}(k=${slot.key})}">
                <td>
                    <div th:text="${slot.label}"></div>
                    <span class="da-filename" th:text="${slot.filename}"></span>
                </td>
                <td><span class="n-badge n-badge-gray" th:text="${slot.category}"></span></td>
                <td class="da-muted-sm" th:text="${slot.layoutLabel}"></td>
                <td th:text="${slot.sizeDisplay}"></td>
                <td>
                    <span th:if="${slot.modifiedAt != null}"
                          th:text="${#temporals.format(slot.modifiedAt, 'yyyy-MM-dd HH:mm:ss')}"></span>
                    <span th:if="${slot.modifiedAt == null}" class="da-muted">—</span>
                </td>
                <td><span class="n-badge" th:classappend="${slot.badgeClass}" th:text="${slot.statusLabel}"></span></td>
                <td class="da-muted-sm" th:text="${slot.replaceCadence}"></td>
            </tr>
            </tbody>
        </table>
    </section>
</div>

<script th:src="@{/system/asset.js}" defer></script>
</body>
</html>
