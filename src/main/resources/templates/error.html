<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--
  공통 에러 뷰. WebExceptionHandler 가 Model 에 담은 status/statusLabel/message 를 렌더한다.
  Spring Boot 기본 에러 경로 /error 도 이 뷰로 연결된다 (templates/error.html 규약).
-->
<head>
    <th:block th:replace="~{fragments/layout :: commonHead('오류')}"></th:block>
</head>
<body>
<nav th:replace="~{fragments/layout :: navbar('os-metadata')}"></nav>

<div class="n-page-md">
    <div class="n-page-header">
        <h1 class="n-page-title">요청을 처리할 수 없습니다</h1>
    </div>

    <div class="n-card">
        <div class="n-card-body">
            <!-- HF5 — 한국어 문구가 주가 되고 상태 코드는 괄호로 따라온다. 종전에는 코드 옆에 영어 라벨을
                 붙였는데, statusLabel 은 advice 경로만 채워 기본 /error 로 온 요청이 "404 Internal Error"
                 처럼 모순된 한 줄로 보였다. 이제 두 경로 모두 ErrorStatusLabels 에서 문구를 파생한다. -->
            <div class="n-alert n-alert-danger" style="margin-bottom: 24px;">
                <div style="font-size: 16px; font-weight: 600;">
                    <span th:text="${statusLabel} ?: '요청을 처리하지 못했습니다'">요청을 처리하지 못했습니다</span>
                    <span th:if="${status != null}" style="font-weight: 500; color: var(--n-text-muted);"
                          th:text="'(' + ${status} + ')'">(500)</span>
                </div>
                <!--/* HF5 (CP5 검증에서 발견) — 설명이 없을 때 "알 수 없는 오류가 발생했습니다." 를 채우면
                     위 문구("페이지를 찾을 수 없습니다")를 뒤에서 부정하게 된다. 무슨 일인지 이미 알려 준
                     상황이므로, 덧붙일 설명이 있을 때만 보여준다. */-->
                <div style="margin-top: 8px;"
                     th:if="${message != null and !#strings.isEmpty(message)}"
                     th:text="${message}">
                    메시지
                </div>
            </div>
            <div class="n-form-actions">
                <a href="javascript:history.back()" class="n-btn n-btn-secondary">← 이전 페이지로</a>
                <a th:href="@{/management/os}" class="n-btn n-btn-primary">홈으로</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
